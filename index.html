<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Такие дела — выдачи и проекты · v1.8</title>
<meta name="description" content="Персональный трекер музейных выдач: проекты, этапы, автодедлайны, контакты, исполнители и заметки.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2v20M4.2 6.5l15.6 11M19.8 6.5L4.2 17.5' stroke='%23c14e24' stroke-width='2.6' stroke-linecap='round' fill='none'/></svg>">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/spectral@latest/500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/spectral@latest/700.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@latest/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@latest/600.css" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffcf6; --surface2:#f8f3e9;
  --ink:#272219; --ink2:#5c5546; --mut:#958a70;
  --line:rgba(39,34,25,.16); --line-soft:rgba(39,34,25,.09);
  --accent:#c14e24; --accent-soft:rgba(193,78,36,.11);
  --green:#3e7d5a; --green-soft:rgba(62,125,90,.13);
  --amber:#a9761c; --amber-soft:rgba(176,122,30,.15);
  --red:#b3392f; --red-soft:rgba(179,57,47,.11);
  --blue:#41628e; --blue-soft:rgba(65,98,142,.13);
  --shadow:0 1px 2px rgba(39,34,25,.05),0 10px 26px -14px rgba(39,34,25,.2);
  --r:12px;
  --display:'Spectral',Georgia,'Times New Roman',serif;
  --body:'Golos Text',-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font:400 15px/1.5 var(--body); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(1100px 560px at 88% -10%, rgba(193,78,36,.08), transparent 60%),
    radial-gradient(900px 520px at -8% 24%, rgba(62,125,90,.07), transparent 60%),
    var(--bg);
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(39,34,25,.055) 1px,transparent 1px);background-size:23px 23px;}
body::after{content:'✳';position:fixed;right:-7vw;bottom:-14vh;font-size:46vh;line-height:1;
  color:rgba(193,78,36,.05);pointer-events:none;z-index:0;}
header,main,footer{position:relative;z-index:1}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(246,242,234,.88);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.hdr-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px;font:700 19px var(--display);color:var(--ink);
  background:none;border:none;cursor:pointer}
.logo svg{color:var(--accent);animation:spin 32s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mainnav{display:flex;gap:4px}
.nbtn{position:relative;background:none;border:none;padding:8px 10px;font:600 14px var(--body);
  color:var(--ink2);cursor:pointer;border-radius:8px;transition:color .15s}
.nbtn:hover{color:var(--accent)}
.nbtn.active{color:var(--ink)}
.nbtn.active::after{content:'';position:absolute;left:10px;right:10px;bottom:2px;height:2.5px;
  border-radius:2px;background:var(--accent)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.save-ind{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);padding-right:4px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.pulse{animation:pulse .9s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,125,90,.5)}100%{box-shadow:0 0 0 9px rgba(62,125,90,0)}}

/* ---------- buttons / chips / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:9px;padding:9px 16px;
  font:600 14px var(--body);cursor:pointer;transition:.18s;line-height:1}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 16px -8px rgba(193,78,36,.55)}
.btn.primary:hover{background:#a9421d;transform:translateY(-1px)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#992e26}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;
  border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer;transition:.15s}
.iconbtn:hover{background:var(--surface2);color:var(--accent);border-color:var(--line-soft)}
.iconbtn.danger-h:hover{color:var(--red)}
.iconbtn.sm{width:26px;height:26px}
.linkbtn{background:none;border:none;color:var(--ink2);font:600 13px var(--body);cursor:pointer;
  display:inline-flex;gap:5px;align-items:center;padding:4px 0;transition:color .15s}
.linkbtn:hover{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.c-blue{background:var(--blue-soft);color:var(--blue)}
.c-green{background:var(--green-soft);color:var(--green)}
.c-amber{background:var(--amber-soft);color:var(--amber)}
.c-red{background:var(--red-soft);color:var(--red)}
.c-muted{background:var(--line-soft);color:var(--ink2)}
.c-type{background:var(--surface2);color:var(--ink2);border:1px solid var(--line-soft)}
.c-exec{background:var(--blue-soft);color:var(--blue)}
.hint{color:var(--mut);font-size:13px;margin:14px 2px;line-height:1.5}
.empty{color:var(--mut);font-size:13.5px;padding:6px 0}
.dim2{color:var(--mut)}
.rise{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- hero / dashboard ---------- */
.hero{padding:34px 0 6px}
.kicker{text-transform:uppercase;letter-spacing:.15em;font-size:11.5px;font-weight:700;color:var(--accent)}
.hero h1{font:700 clamp(36px,5.4vw,58px)/1.05 var(--display);margin:8px 0 10px}
.ast{color:var(--accent);display:inline-block;margin-left:10px;animation:spin 26s linear infinite;transform-origin:center}
.lede{color:var(--ink2);font-size:16.5px;max-width:660px;line-height:1.55}
.lede.small{font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 10px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow);transition:transform .22s}
.stat:hover{transform:translateY(-3px)}
.stat b{font:700 34px/1 var(--display);display:block}
.stat:nth-child(1) b{color:var(--accent)}
.stat:nth-child(2) b{color:var(--green)}
.stat:nth-child(3) b{color:var(--blue)}
.stat span{font-weight:700;font-size:13px;color:var(--ink2);display:block;margin-top:7px}
.stat small{color:var(--mut);font-size:12px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-bar{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap}
.dash-bar h2{font:700 26px var(--display)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:16px;margin-top:14px}
.pcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,opacity .25s;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),#d97a3f);opacity:0;transition:.25s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 18px 34px -16px rgba(39,34,25,.3)}
.pcard:hover::before{opacity:1}
.pcard.is-done{opacity:.78}
.pcard.is-done:hover{opacity:1}
.pcard-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
.orgchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink2);background:var(--surface2);border:1px solid var(--line-soft);
  padding:3px 9px;border-radius:999px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgchip svg{width:12px;height:12px;flex:none}
button.orgchip{cursor:pointer;transition:.15s}
button.orgchip:hover{color:var(--accent);border-color:var(--accent)}
.orgchip.dashed{border-style:dashed;color:var(--mut)}
.orgchip.dashed:hover{color:var(--blue);border-color:var(--blue)}
.chip-caret{font-size:9px;opacity:.65;margin-left:2px}
.pcard-title{font:700 21px/1.2 var(--display);margin:2px 0 10px;transition:color .2s}
.pcard:hover .pcard-title{color:var(--accent)}
.pcard-dv{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);margin-bottom:11px;flex-wrap:wrap}
.pcard-dv svg{color:var(--mut);flex:none}
.pcard-dv .cd{margin-left:auto;color:var(--accent);font-weight:700;white-space:nowrap}
.pbar{height:7px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.pbar i.f-prep{background:linear-gradient(90deg,var(--accent),#d97a3f)}
.pbar i.f-out{background:var(--green)}
.pbar i.f-late{background:var(--amber)}
.pbar i.f-done{background:var(--ink2)}
.pcard-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-top:9px}
.overbadge{color:var(--red);font-weight:700}
.empty-big{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink2);
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty-big p{margin-bottom:16px}
.pgrid-divider{grid-column:1/-1;display:flex;align-items:center;gap:12px;color:var(--mut);
  font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 0}
.pgrid-divider::before,.pgrid-divider::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- project view ---------- */
.proj-head{padding-top:24px}
.title-line{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:14px;flex-wrap:wrap}
.proj-title{font:700 clamp(24px,3.4vw,34px)/1.15 var(--display);cursor:pointer;display:flex;gap:10px;align-items:center}
.proj-title .pen{opacity:0;color:var(--mut);transition:.2s;display:inline-flex}
.proj-title:hover .pen{opacity:1;color:var(--accent)}
.rename-input{font:700 clamp(24px,3.4vw,34px) var(--display);border:none;border-bottom:2px solid var(--accent);
  background:transparent;outline:none;width:100%;padding:0 0 2px;color:var(--ink)}
.title-side{display:flex;align-items:center;gap:8px}
.dates-line{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:16px}
.datefield{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.datefield input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font:500 13.5px var(--body);color:var(--ink);outline:none;transition:.15s}
.datefield input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cd-banner{margin-left:auto;display:flex;align-items:baseline;gap:9px;padding:10px 18px;border-radius:12px;
  background:var(--accent-soft);color:var(--accent)}
.cd-banner b{font:700 30px/1 var(--display)}
.cd-banner span{font-size:13px;font-weight:600}
.cd-banner.out{background:var(--green-soft);color:var(--green)}
.cd-banner.today{background:var(--amber-soft);color:var(--amber)}
.cd-banner.ret{background:var(--line-soft);color:var(--ink2)}
.proj-progress{display:flex;align-items:center;gap:14px;margin-top:16px}
.ptrack{flex:1;height:9px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.ptrack i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#d97a3f);
  border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
#projStatsTx{font-size:13px;color:var(--ink2);white-space:nowrap}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:24px 0 18px;overflow-x:auto}
.ptab{position:relative;background:none;border:none;padding:10px 2px 12px;font:600 15px var(--body);
  color:var(--ink2);cursor:pointer;white-space:nowrap}
.ptab::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);
  border-radius:3px 3px 0 0;transform:scaleX(0);transition:transform .25s}
.ptab.active{color:var(--ink)}
.ptab.active::after{transform:scaleX(1)}
.ptab:hover{color:var(--accent)}
.cnt{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px;font-size:12px;margin-left:5px}

/* ---------- stages ---------- */
.stage{display:grid;grid-template-columns:46px 1fr;gap:14px;background:var(--surface);
  border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;transition:box-shadow .2s}
.stage:hover{box-shadow:var(--shadow)}
.stage.st-over{border-left-color:var(--red)}
.stage.st-done{border-left-color:var(--green)}
.stage.st-soon{border-left-color:var(--amber)}
.stage.st-todo{border-left-color:var(--blue)}
.stage-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:700 16px var(--display);margin-top:2px;flex:none}
.n-st-done{background:var(--green-soft);color:var(--green)}
.n-st-over{background:var(--red-soft);color:var(--red)}
.n-st-soon{background:var(--amber-soft);color:var(--amber)}
.n-st-todo{background:var(--blue-soft);color:var(--blue)}
.stage-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.stage-head h4{font:700 17.5px var(--display);display:flex;align-items:center;gap:6px}
.st-edit{opacity:0}
.stage-head h4:hover .st-edit{opacity:1}
.stage-title-input{font:700 17.5px var(--display);border:none;border-bottom:2px solid var(--accent);
  background:transparent;outline:none;width:100%;max-width:440px;padding:0 0 2px;color:var(--ink)}
.stage-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dl{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--mut)}
.dl.bad{color:var(--red);font-weight:700}
.tasks{list-style:none;margin:10px 0 4px;border-top:1px dashed var(--line);padding-top:8px}
.task{display:flex;align-items:flex-start;gap:6px;padding:5px 6px;border-radius:8px;transition:background .15s;flex-wrap:wrap}
.task:hover{background:var(--surface2)}
.task .t-edit,.task .iconbtn.t-del{opacity:0}
.task:hover .t-edit,.task:hover .t-del{opacity:1}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1;min-width:min(230px,100%)}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:19px;height:19px;margin-top:2px;border:2px solid var(--mut);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:all .18s}
.box svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:all .18s}
.chk input:checked + .box{background:var(--green);border-color:var(--green)}
.chk input:checked + .box svg{opacity:1;transform:scale(1)}
.chk input:checked ~ .txt{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(39,34,25,.3)}
.txt{color:var(--ink2);line-height:1.45}
.task-assign{font:600 12px var(--body);color:var(--ink2);border:1px dashed var(--line);border-radius:999px;
  padding:3px 9px;background:transparent;cursor:pointer;max-width:180px;transition:.15s;margin-top:1px}
select.task-assign{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.task-assign:hover{border-color:var(--blue);color:var(--blue)}
.task-assign.has{border-style:solid;border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
button.task-assign{display:inline-flex;align-items:center;gap:5px;color:var(--mut)}
button.task-assign:hover{color:var(--blue);border-color:var(--blue)}
.task-edit-input{flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--accent);border-radius:8px;
  font:500 13.5px var(--body);outline:none;background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.stage-actions{display:flex;gap:18px;align-items:center;margin-top:6px;flex-wrap:wrap}
.task-add-row{display:flex;gap:8px;align-items:center;flex:1;min-width:220px}
.task-add-row input{flex:1;padding:7px 10px;border:1px solid var(--accent);border-radius:8px;
  font:500 13.5px var(--body);outline:none;background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.divider-done{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:700;font-size:12.5px;
  letter-spacing:.1em;text-transform:uppercase;margin:20px 0 14px}
.divider-done::before,.divider-done::after{content:'';flex:1;height:1px;background:var(--line)}
.divider-done svg{flex:none}

/* ---------- timeline ---------- */
.tl-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kd{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 16px;box-shadow:var(--shadow)}
.kd span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kd b{display:block;font:700 20px var(--display);margin:4px 0 2px}
.kd small{color:var(--ink2);font-size:12.5px}
.kd-dv{border-top:3px solid var(--accent)}
.kd-open{border-top:3px solid var(--blue)}
.kd-ret{border-top:3px solid var(--green)}
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
.tl-scroll::-webkit-scrollbar{height:8px}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.tl-canvas{position:relative;height:244px;min-width:100%}
.tl-month{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.tl-month span{position:absolute;top:6px;left:5px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.tl-axis{position:absolute;top:118px;height:2px;background:var(--line);left:16px;right:16px;border-radius:2px}
.tl-today{position:absolute;top:0;height:100%;border-left:2px dashed var(--red);z-index:4}
.tl-today span{position:absolute;top:88px;left:0;transform:translateX(-50%);background:var(--red);color:#fff;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tl-key{position:absolute;left:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.tl-key .flag{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.tl-key .stem{width:2px}
.k-dv{top:12px}.k-dv .flag{background:var(--accent)}.k-dv .stem{height:80px;background:var(--accent)}
.k-open{top:46px}.k-open .flag{background:var(--blue)}.k-open .stem{height:46px;background:var(--blue)}
.k-ret{top:12px}.k-ret .flag{background:var(--green)}.k-ret .stem{height:80px;background:var(--green)}
.tl-dot{position:absolute;top:110px;width:17px;height:17px;border-radius:50%;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;color:#fff;z-index:3;border:2px solid var(--surface);
  box-shadow:0 1px 4px rgba(0,0,0,.22);cursor:default;transition:transform .15s}
.tl-dot:hover{transform:translateX(-50%) scale(1.35);z-index:6}
.tl-dot b{font-size:8.5px;font-weight:800;line-height:1}
.tl-dot.st-done{background:var(--green)}
.tl-dot.st-over{background:var(--red);animation:blink 1.6s infinite}
.tl-dot.st-soon{background:var(--amber)}
.tl-dot.st-todo{background:var(--blue)}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(179,57,47,.45)}50%{box-shadow:0 0 0 7px rgba(179,57,47,0)}}
.tl-lab{position:absolute;transform-origin:0 0;transform:rotate(38deg);font-size:10.5px;color:var(--ink2);white-space:nowrap}

/* ---------- contacts ---------- */
.contact-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}

.panel-head h3{font:700 18px var(--display)}
.link-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--line);
  border-radius:10px;margin-bottom:8px;background:var(--surface2)}
.lr-main{min-width:0}
.lr-main b{font-size:14.5px}
.lr-main small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.lr-act{display:flex;gap:4px;align-items:center;flex:none}
.attach-panel{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px;display:flex;
  flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.attach-item{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer}
.attach-item:hover{background:var(--surface2)}
.attach-item b{font-size:13.5px;display:block}
.attach-item small{color:var(--mut);font-size:11.5px;display:block}
.attach-item input{accent-color:var(--accent);width:16px;height:16px;flex:none}

/* ---------- notes ---------- */
.composer{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);margin-bottom:18px}
.composer textarea{width:100%;border:none;background:transparent;resize:vertical;min-height:54px;
  font:400 15px/1.5 var(--body);outline:none;color:var(--ink)}
.composer-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.swatches{display:flex;gap:8px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--sw);cursor:pointer;transition:.15s}
.sw:hover{transform:scale(1.15)}
.sw.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.notes-grid{columns:3 230px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;background:var(--nc,#fffdf6);border:1px solid rgba(39,34,25,.09);
  border-radius:10px;padding:28px 14px 10px;position:relative;box-shadow:0 2px 6px rgba(39,34,25,.06);
  transition:transform .2s,box-shadow .2s}
.note:nth-child(odd){transform:rotate(-.5deg)}
.note:nth-child(even){transform:rotate(.45deg)}
.note:hover{transform:rotate(0) translateY(-2px);box-shadow:var(--shadow)}
.note.pinned{border-color:rgba(193,78,36,.5)}
.note.sun{--nc:#fbf0c4}.note.rose{--nc:#fadfdc}.note.sky{--nc:#dbe9f6}.note.mint{--nc:#dcefe1}.note.paper{--nc:#fffdf6}
.note-text{white-space:pre-wrap;font-size:14px;line-height:1.5}
.note footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  color:rgba(39,34,25,.55);font-size:11.5px;gap:6px;flex-wrap:wrap}
.note-btns button{background:none;border:none;cursor:pointer;color:inherit;opacity:.7;padding:2px;display:inline-flex}
.note-btns button:hover{opacity:1;color:var(--accent)}
.pinbtn{position:absolute;top:6px;right:6px;opacity:.45}
.pinbtn.on{opacity:1;color:var(--accent)}
.edit-ta{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:8px;
  font:400 14px/1.5 var(--body);background:rgba(255,255,255,.65);outline:none;resize:vertical}

/* ---------- book ---------- */
.book-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:30px;flex-wrap:wrap}
.book-head h1{font:700 clamp(28px,4vw,42px) var(--display);margin:6px 0}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;margin-top:6px;padding-bottom:20px}
.bcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:17px;
  box-shadow:var(--shadow);transition:transform .22s}
.bcard:hover{transform:translateY(-3px)}
.bcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.bcard h3{font:700 19px var(--display)}
.bline{font-size:13.5px;color:var(--ink2);margin:3px 0;word-break:break-word}
.bline .dim{color:var(--mut)}
.bnote{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:8px;padding:7px 10px;margin-top:8px}
.bmeta{font-size:12px;color:var(--mut);margin-top:10px}
.bcard-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  border-top:1px dashed var(--line);padding-top:11px}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(39,34,25,.42);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:20px;z-index:90;animation:fade .2s}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:min(540px,100%);
  box-shadow:0 30px 60px -20px rgba(39,34,25,.45);animation:pop .24s cubic-bezier(.2,.9,.3,1.15);
  max-height:88vh;overflow:auto}
.modal-sm{width:min(420px,100%)}
.modal h3{font:700 24px var(--display);margin-bottom:16px}

.modal input,.modal select,.modal textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font:500 14px var(--body);background:#fff;color:var(--ink);outline:none;transition:.15s;width:100%}

.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  border-radius:8px;padding:9px 12px;margin-bottom:4px;line-height:1.5}
.org-picker{display:flex;gap:8px;margin-bottom:9px}
.org-picker select{flex:1}
.org-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:22px;align-items:center}
.org-sel-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.org-sel-chip svg{width:12px;height:12px}
.osc-x{background:none;border:none;cursor:pointer;color:var(--mut);display:inline-flex;padding:0;transition:color .15s}
.osc-x:hover{color:var(--red)}
.confirm-text{color:var(--ink2);line-height:1.55}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:8px;z-index:120;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#f6f2ea;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  opacity:0;transform:translateY(12px);transition:.3s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--red)}

.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:44px 20px 34px}

@media(max-width:860px){
  .stats{grid-template-columns:1fr 1fr}

  .hdr-in{flex-wrap:wrap;gap:8px}

<body>
<header id="hdr"></header>
<main id="app"></main>
<footer class="foot">«Такие дела» · персональный трекер выдач · версия 1.8 · данные хранятся локально в вашем браузере</footer>

<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const todayISO=()=>toISO(new Date());
const addDaysISO=(iso,n)=>{const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);};
const daysBetween=(a,b)=>Math.round((fromISO(b)-fromISO(a))/86400000);
const daysUntil=iso=>daysBetween(todayISO(),iso);
const MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fmtShort=iso=>{if(!iso)return '—';const d=fromISO(iso);return d.getDate()+' '+MONTHS[d.getMonth()];};
const fmtLong=iso=>{if(!iso)return '—';const d=fromISO(iso);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};
const plural=(n,one,few,many)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return many;if(n1>1&&n1<5)return few;if(n1===1)return one;return many;};
const dWord=n=>plural(n,'день','дня','дней');

const svg=p=>'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const I={
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  back:svg('<path d="M15 18l-6-6 6-6"/>'),
  dl:svg('<path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
  ul:svg('<path d="M12 14V3m0 0L8 7m4-4l4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
  trash:svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/>'),
  pen:svg('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>'),
  x:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  check:svg('<path d="M4 12l5 5L20 7"/>'),
  cal:svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>'),
  pin:svg('<circle cx="12" cy="8" r="5"/><path d="M12 13v8"/>'),
  user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>')
};

/* ================= шаблон этапов ================= */
const MERGED_STAGE={
  t:'Согласование списка, сохранности и наличия предметов.',
  a:'dv',off:-60,
  tasks:[
    'Предварительный список составлен в КАМИС.',
    'Наличие и сохранность подтверждена хранителем коллекции.',
    'Список согласован с заказчиком.'
  ]
};
const STAGES_TEMPLATE=[
 {t:'Заявка и принципиальное согласие',a:'dv',off:-90,tasks:[
   'Получен запрос от партнёра: письмо, состав выставки, сроки',
   'Проверены даты и площадка проведения',
   'Получено принципиальное согласие руководства']},
 {t:MERGED_STAGE.t,a:MERGED_STAGE.a,off:MERGED_STAGE.off,tasks:MERGED_STAGE.tasks.slice()},
 {t:'Договор и страхование',a:'dv',off:-45,tasks:[
   'Подготовлен проект договора о временной передаче',
   'Согласована страховая оценка «гвоздь в гвоздь»',
   'Договор подписан, страховка оформлена']},
 {t:'Логистика и упаковка',a:'dv',off:-21,tasks:[
   'Выбран перевозчик, согласован маршрут',
   'Подготовлена упаковка и климат-контроль',
   'Согласовано сопровождение груза курьером']},
 {t:'Документы на выдачу',a:'dv',off:-7,tasks:[
   'Составлен акт выдачи с полным перечнем',
   'Оформлены доверенности курьеру',
   'Согласованы дата и время выдачи']},
 {t:'Выдача предметов',a:'dv',off:0,tasks:[
   'Упаковка в присутствии комиссии',
   'Акт выдачи подписан сторонами',
   'Предметы переданы перевозчику']},
 {t:'Доставка и монтаж',a:'dv',off:3,tasks:[
   'Курьер сопроводил груз до площадки',
   'Распаковка и сверка по акту на месте',
   'Монтаж завершён, витрины приняты']},
 {t:'Контроль на выставке',a:'open',off:14,tasks:[
   'Куратор посетил выставку и осмотрел предметы',
   'Проверка климата и освещённости в витринах',
   'Получен промежуточный отчёт партнёра']},
 {t:'Демонтаж',a:'ret',off:-3,tasks:[
   'Даты демонтажа согласованы с партнёром',
   'Упаковка подготовлена курьером',
   'Демонтаж выполнен, предметы сверены по акту']},
 {t:'Возврат предметов',a:'ret',off:0,tasks:[
   'Груз доставлен обратно в музей',
   'Распаковка в присутствии комиссии',
   'Акт возврата подписан сторонами']},
 {t:'Итоговая проверка и закрытие',a:'ret',off:7,tasks:[
   'Сверка состояния с актами сохранности',
   'При необходимости — отчёт о повреждениях и претензия',
   'Договор закрыт, документы переданы в архив']}
];
const makeStages=()=>STAGES_TEMPLATE.map(s=>({t:s.t,a:s.a,off:s.off,tasks:s.tasks.map(x=>({id:uid(),text:x,done:false,assigneeId:''}))}));

/* ================= state ================= */
const LS_KEY='takiedela_v15';
let state=null;
const ui={view:'dash',projectId:null,tab:'stages',openAttach:null,addingStage:null,editStage:null,editTask:null,noteColor:'sun',noteDraft:'',editNote:null,bookTab:'orgs'};
let contactModalOrgs=[];
const cur=()=>state.projects.find(p=>p.id===ui.projectId)||null;

function seed(){
  const T=todayISO();
  const orgA={id:uid(),name:'Музей цветов',type:'Музей',city:'Москва',phone:'+7 495 120-45-67',email:'partners@flowermuseum.ru',note:'Постоянный партнёр, бережная логистика'};
  const orgB={id:uid(),name:'Галерея «Луга»',type:'Галерея',city:'Санкт-Петербург',phone:'+7 812 244-90-11',email:'expo@luga.gallery',note:''};
  const c1={id:uid(),name:'Анна Соколова',position:'Куратор выставок',orgIds:[orgA.id],phone:'+7 903 555-12-89',email:'a.sokolova@flowermuseum.ru',note:'Главный контакт по «Выставке ромашек»'};
  const c2={id:uid(),name:'Дмитрий Верещагин',position:'Менеджер по логистике',orgIds:[orgA.id,orgB.id],phone:'+7 921 400-77-31',email:'d.vereshchagin@luga.gallery',note:'Климат-боксы, сопровождение грузов'};
  const c3={id:uid(),name:'Мария Ковалёва',position:'Хранитель фонда керамики',orgIds:[orgB.id],phone:'',email:'m.kovaleva@luga.gallery',note:''};
  const e1={id:uid(),name:'Ирина Мельник',role:'Реставратор',phone:'+7 916 220-34-58',email:'i.melnik@flowermuseum.ru',note:'Осмотр и паспорта сохранности'};
  const e2={id:uid(),name:'Сергей Ковалевский',role:'Упаковщик · курьер',phone:'+7 905 118-72-40',email:'',note:'Работает с хрупкой керамикой и ботаникой'};
  const e3={id:uid(),name:'Ольга Ремез',role:'Договоры и страхование',phone:'',email:'o.remez@flowermuseum.ru',note:''};

  const p1={id:uid(),name:'Выставка ромашек',orgId:orgA.id,dv:addDaysISO(T,38),open:addDaysISO(T,41),ret:addDaysISO(T,118),stages:makeStages(),orgIds:[orgA.id],contactIds:[c1.id,c2.id]};
  const p2={id:uid(),name:'Фарфор XVIII века',orgId:orgB.id,dv:addDaysISO(T,104),open:addDaysISO(T,108),ret:addDaysISO(T,190),stages:makeStages(),orgIds:[orgB.id],contactIds:[c3.id]};
  const p3={id:uid(),name:'Гербарий Севера',orgId:orgA.id,dv:addDaysISO(T,-12),open:addDaysISO(T,-9),ret:addDaysISO(T,66),stages:makeStages(),orgIds:[orgA.id],contactIds:[c1.id]};
  const done=(p,s,n)=>{for(let k=0;k<n;k++){const t=p.stages[s].tasks[k];if(t)t.done=true;}};
  const asg=(p,s,t,ex)=>{const task=p.stages[s].tasks[t];if(task)task.assigneeId=ex.id;};
  done(p1,0,3); done(p1,1,3); done(p1,2,2); done(p1,3,1);
  asg(p1,1,1,e1); asg(p1,2,1,e3); asg(p1,3,1,e2); asg(p1,3,2,e2);
  done(p2,0,3); done(p2,1,2);
  asg(p2,0,1,e3);
  for(let s=0;s<7;s++) done(p3,s,3); done(p3,7,1);
  asg(p3,1,1,e1); asg(p3,6,0,e2);

  const notes=[
    {id:uid(),projectId:p1.id,text:'Ромашки просят витрину №4 — уточнить у Анны до подписания договора.',color:'sun',pinned:true,createdAt:addDaysISO(T,-3)},
    {id:uid(),projectId:p1.id,text:'Страховая просит обновлённые фото паспортов сохранности до конца недели.',color:'rose',pinned:false,createdAt:addDaysISO(T,-1)},
    {id:uid(),projectId:p1.id,text:'Сергей подтвердил климат-бокс на 22 предмета.',color:'mint',pinned:false,createdAt:T},
    {id:uid(),projectId:p2.id,text:'Проверить трещину на блюдце №12 перед фотофиксацией.',color:'sky',pinned:false,createdAt:T}
  ];
  return {projects:[p1,p2,p3],orgs:[orgA,orgB],contacts:[c1,c2,c3],executors:[e1,e2,e3],notes};
}
function normalize(d){
  return {projects:Array.isArray(d.projects)?d.projects:[],orgs:d.orgs||[],contacts:d.contacts||[],executors:d.executors||[],notes:d.notes||[]};
}
function migrateMergedStage(p){
  const i=p.stages.findIndex(s=>s.t==='Согласование списка предметов');
  if(i<0)return false;
  const B=p.stages[i+1];
  if(!B||B.t!=='Проверка сохранности')return false;
  const A=p.stages[i];
  const src=(st,k)=>st.tasks[k]||{done:false,assigneeId:''};
  const tasks=[
    {id:uid(),text:MERGED_STAGE.tasks[0],done:src(A,0).done,assigneeId:src(A,0).assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[1],done:src(B,0).done,assigneeId:src(B,0).assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[2],done:src(A,2).done,assigneeId:src(A,2).assigneeId||''}
  ];
  A.tasks.concat(B.tasks).forEach(t=>{if(t.custom)tasks.push(t);});
  p.stages.splice(i,2,{t:MERGED_STAGE.t,a:'dv',off:MERGED_STAGE.off,tasks});
  return true;
}
function migrateAll(){
  let changed=false;
  state.projects.forEach(p=>{if(migrateMergedStage(p))changed=true;});
  if(changed)persist(false);
}
function persist(flash){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  if(flash!==false)flashSave();
}
function load(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.projects)){state=normalize(d);return;}}}catch(e){}
  state=seed();persist(false);
}
function flashSave(){
  const dot=$('#saveDot'),txt=$('#saveTxt');
  if(!dot)return;
  txt.textContent='Сохранено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  dot.classList.remove('pulse');void dot.offsetWidth;dot.classList.add('pulse');
}

/* ================= вычисления ================= */
function projStats(p){let done=0,total=0;p.stages.forEach(s=>s.tasks.forEach(t=>{total++;if(t.done)done++;}));return{done,total,pct:total?Math.round(done/total*100):0};}
function projPhase(p){
  const st=projStats(p),T=todayISO();
  if(st.total&&st.done===st.total)return{key:'done',cls:'c-muted',label:'Завершён'};
  if(p.dv&&T>p.dv){if(p.ret&&T>p.ret)return{key:'late',cls:'c-amber',label:'Возврат · проверка'};return{key:'out',cls:'c-green',label:'На выставке'};}
  return{key:'prep',cls:'c-blue',label:'Подготовка'};
}
function countdownText(p){
  if(!p.dv)return 'дата не задана';
  const n=daysUntil(p.dv);
  if(n>1)return 'через '+n+' '+dWord(n);
  if(n===1)return 'завтра';
  if(n===0)return 'сегодня';
  return (-n)+' '+dWord(-n)+' назад';
}
function cdInfo(p){
  const n=daysUntil(p.dv);
  if(n>1)return{cls:'prep',big:String(n),lab:plural(n,'день','дня','дней')+' до выдачи'};
  if(n===1)return{cls:'prep',big:'1',lab:'день до выдачи'};
  if(n===0)return{cls:'today',big:'✳',lab:'выдача сегодня'};
  if(p.ret){const r=daysUntil(p.ret);
    if(r>1)return{cls:'out',big:String(r),lab:plural(r,'день','дня','дней')+' до возврата'};
    if(r===1)return{cls:'out',big:'1',lab:'день до возврата'};
    if(r===0)return{cls:'today',big:'✳',lab:'возврат сегодня'};
    return{cls:'ret',big:'✓',lab:'возврат завершён'};}
  return{cls:'out',big:String(-n),lab:plural(-n,'день','дня','дней')+' на выставке'};
}
function stageDeadline(p,s){
  const base=s.a==='ret'?p.ret:(s.a==='open'?(p.open||p.dv):p.dv);
  return base?addDaysISO(base,s.off):null;
}
function stageInfo(p,s){
  const allDone=s.tasks.length&&s.tasks.every(t=>t.done);
  const dl=stageDeadline(p,s);
  if(allDone)return{status:'done',cls:'st-done',chipCls:'c-green',label:'Готово'};
  if(dl&&daysUntil(dl)<0)return{status:'overdue',cls:'st-over',chipCls:'c-red',label:'Просрочено'};
  const started=s.tasks.some(t=>t.done);
  if(dl&&daysUntil(dl)<=7)return{status:'soon',cls:'st-soon',chipCls:'c-amber',label:started?'В работе':'Скоро'};
  return{status:'todo',cls:'st-todo',chipCls:'c-blue',label:started?'В работе':'Ожидает'};
}
const stageComplete=s=>s.tasks.length&&s.tasks.every(t=>t.done);
const execById=id=>state.executors.find(x=>x.id===id)||null;
const execTasksCount=id=>state.projects.reduce((a,p)=>a+p.stages.reduce((b,s)=>b+s.tasks.filter(t=>(t.assigneeId||'')===id).length,0),0);

/* ================= дашборд ================= */
function dashStats(){
  const ps=state.projects,T=todayISO();
  const inWork=ps.filter(p=>{const s=projStats(p);return !(s.total&&s.done===s.total);}).length;
  const avg=ps.length?Math.round(ps.reduce((a,p)=>a+projStats(p).pct,0)/ps.length):0;
  const upcoming=ps.filter(p=>p.dv&&p.dv>=T).sort((a,b)=>a.dv.localeCompare(b.dv))[0];
  return{total:ps.length,inWork,avg,upcoming};
}
function projectCard(p,i){
  const st=projStats(p),ph=projPhase(p),org=state.orgs.find(o=>o.id===p.orgId);
  const over=p.stages.reduce((a,s)=>a+(stageInfo(p,s).status==='overdue'?1:0),0);
  return '<article class="pcard rise'+(ph.key==='done'?' is-done':'')+'" style="animation-delay:'+Math.min(i*70,420)+'ms" data-action="open-project" data-id="'+p.id+'">'
   +'<div class="pcard-top">'+(org?'<span class="orgchip">'+esc(org.name)+'</span>':'<span class="orgchip">без партнёра</span>')
   +'<span class="chip '+ph.cls+'">'+ph.label+'</span></div>'
   +'<h3 class="pcard-title">'+esc(p.name)+'</h3>'
   +'<div class="pcard-dv">'+I.cal+'<span>выдача '+fmtLong(p.dv)+'</span><b class="cd">'+countdownText(p)+'</b></div>'
   +'<div class="pbar"><i class="f-'+ph.key+'" style="width:'+st.pct+'%"></i></div>'
   +'<div class="pcard-foot"><span>'+st.done+'/'+st.total+' задач · '+st.pct+'%</span>'
   +(over?'<span class="overbadge">просрочено: '+over+'</span>':'<span class="dim2">возврат '+fmtShort(p.ret)+'</span>')+'</div></article>';
}

   +'<div class="stat"><b>'+s.inWork+'</b><span>в работе</span><small>проектов всего: '+s.total+'</small></div>'
   +'<div class="stat"><b>'+s.avg+'%</b><span>средний прогресс</span><small>по всем чек-листам</small></div>'
   +'<div class="stat"><b>'+(near?daysUntil(near.dv):'—')+'</b><span>дней до ближайшей выдачи</span><small>'+(near?esc(near.name):'нет запланированных выдач')+'</small></div>'
   +'</section>'

function assignControl(i,t){

   +state.executors.map(x=>'<option value="'+x.id+'"'+(curId===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')

function taskRow(i,t){
  const editing=ui.editTask&&ui.editTask.stage===i&&ui.editTask.id===t.id;

   +'</li>';

function stageCard(p,s,i){
  const inf=stageInfo(p,s),dl=stageDeadline(p,s);

  const editingTitle=ui.editStage===i;
  return '<section class="stage '+inf.cls+'" data-stage="'+i+'">'

   +'<div class="stage-main">'
   +'<div class="stage-head">'
   +(editingTitle
     ?'<input id="stageTitleInput" class="stage-title-input" maxlength="90" value="'+esc(s.t)+'">'

   +'<div class="stage-meta"><span class="dl'+(inf.status==='overdue'?' bad':'')+'">'+I.cal+(dl?('до '+fmtLong(dl)):'нужна дата возврата')+'</span>'
   +'<span class="chip stage-chip '+inf.chipCls+'">'+inf.label+'</span></div></div>'

     :'<button class="linkbtn" data-action="task-add" data-stage="'+i+'">'+I.plus+' Добавить задачу</button>')

function stagesInner(p){
  const order=p.stages.map((s,i)=>({s,i}));
  const act=order.filter(x=>!stageComplete(x.s));
  const fin=order.filter(x=>stageComplete(x.s));
  let h=act.map(x=>stageCard(p,x.s,x.i)).join('');
  if(fin.length){
    h+='<div class="divider-done">'+I.check+' Выполнено · '+fin.length+'</div>';
    h+=fin.map(x=>stageCard(p,x.s,x.i)).join('');

}
function stagesTab(p){

function focusTaskAdd(){

/* -------- таймлайн -------- */
function timelineTab(p){
  const T=todayISO(),items=[],keys=[];
  p.stages.forEach((s,i)=>{const dl=stageDeadline(p,s);if(dl)items.push({date:dl,i,s});});
  if(p.dv)keys.push({date:p.dv,label:'Выдача',cls:'k-dv'});
  if(p.open)keys.push({date:p.open,label:'Открытие',cls:'k-open'});
  if(p.ret)keys.push({date:p.ret,label:'Возврат',cls:'k-ret'});
  const all=items.map(x=>x.date).concat(keys.map(k=>k.date)).sort();
  if(!all.length)return '<p class="empty">Укажите дату выдачи, чтобы построить таймлайн.</p>';
  const start=addDaysISO(all[0],-7),end=addDaysISO(all[all.length-1],9);
  const totalDays=Math.max(daysBetween(start,end),1);
  const px=Math.max(13,Math.min(30,Math.round(1500/totalDays)));
  const PAD=26,width=totalDays*px+PAD*2;
  const X=iso=>PAD+daysBetween(start,iso)*px;
  let monthsHtml='';
  {let d=fromISO(start);d.setDate(1);if(toISO(d)<start)d.setMonth(d.getMonth()+1);
   while(toISO(d)<=end){monthsHtml+='<div class="tl-month" style="left:'+X(toISO(d))+'px"><span>'+MONTHS[d.getMonth()]+(d.getMonth()===0?' '+d.getFullYear():'')+'</span></div>';d.setMonth(d.getMonth()+1);}}
  const todayHtml=(T>=start&&T<=end)?'<div class="tl-today" style="left:'+X(T)+'px"><span>сегодня</span></div>':'';
  const keysHtml=keys.map(k=>'<div class="tl-key '+k.cls+'" style="left:'+X(k.date)+'px"><span class="flag">'+k.label+'</span><i class="stem"></i></div>').join('');
  const words={done:'готово',overdue:'просрочено',soon:'скоро — осталось меньше недели',todo:'впереди'};
  const dotsHtml=items.map(it=>{
    const inf=stageInfo(p,it.s);
    const lab=(it.i+1)+'. '+(it.s.t.length>26?it.s.t.slice(0,26)+'…':it.s.t);
    const tip=esc((it.i+1)+'. '+it.s.t+' — до '+fmtLong(it.date)+' · '+words[inf.status]);
    return '<div class="tl-dot '+inf.cls+'" style="left:'+X(it.date)+'px" title="'+tip+'"><b>'+(it.i+1)+'</b></div>'
      +'<span class="tl-lab" style="left:'+(X(it.date)+2)+'px;top:'+(it.i%2?152:128)+'px">'+esc(lab)+'</span>';
  }).join('');
  const cdFor=iso=>{const n=daysUntil(iso);if(n===0)return 'сегодня';if(n>0)return 'через '+n+' '+dWord(n);return (-n)+' '+dWord(-n)+' назад';};
  const cards=[['Дата выдачи',p.dv,'kd-dv'],['Открытие',p.open,'kd-open'],['Возврат',p.ret,'kd-ret']].map(c=>
    '<div class="kd '+c[2]+'"><span>'+c[0]+'</span><b>'+(c[1]?fmtLong(c[1]):'—')+'</b><small>'+(c[1]?cdFor(c[1]):'не указана')+'</small></div>').join('');
  return '<div class="tl-cards rise">'+cards+'</div>'
   +'<div class="tl-scroll rise" style="animation-delay:70ms"><div class="tl-canvas" style="width:'+width+'px">'
   +monthsHtml+'<div class="tl-axis"></div>'+todayHtml+keysHtml+dotsHtml+'</div></div>'
   +'<div class="tl-legend"><span><i class="lg st-done"></i>готово</span><span><i class="lg st-over"></i>просрочено</span>'
   +'<span><i class="lg st-soon"></i>скоро</span><span><i class="lg st-todo"></i>впереди</span><span><i class="lg lg-today"></i>сегодня</span></div>'
   +'<p class="hint">Наведите курсор на точку этапа, чтобы увидеть детали. Дедлайны пересчитываются автоматически при смене дат в шапке проекта.</p>';
}

function orgRow(o){
  return '<div class="link-row"><div class="lr-main"><b>'+esc(o.name)+'</b>'
   +'<small>'+esc([o.type,o.city].filter(Boolean).join(' · '))+'</small>'
   +((o.phone||o.email)?'<small>'+(o.phone?'☎ '+esc(o.phone):'')+(o.phone&&o.email?' · ':'')+(o.email?'✉ '+esc(o.email):'')+'</small>':'')
   +'</div><div class="lr-act"><button class="iconbtn sm" title="Изменить" data-action="org-edit" data-id="'+o.id+'">'+I.pen+'</button>'
   +'<button class="iconbtn sm" title="Отвязать от проекта" data-action="attach-remove" data-kind="org" data-id="'+o.id+'">'+I.x+'</button></div></div>';
}
function contactRow(c){
  const orgNames=state.orgs.filter(o=>c.orgIds.includes(o.id)).map(o=>o.name).join(', ');
  return '<div class="link-row"><div class="lr-main"><b>'+esc(c.name)+'</b>'
   +'<small>'+esc([c.position,orgNames].filter(Boolean).join(' · '))+'</small>'
   +((c.phone||c.email)?'<small>'+(c.phone?'☎ '+esc(c.phone):'')+(c.phone&&c.email?' · ':'')+(c.email?'✉ '+esc(c.email):'')+'</small>':'')
   +'</div><div class="lr-act"><button class="iconbtn sm" title="Изменить" data-action="contact-edit" data-id="'+c.id+'">'+I.pen+'</button>'
   +'<button class="iconbtn sm" title="Отвязать от проекта" data-action="attach-remove" data-kind="contact" data-id="'+c.id+'">'+I.x+'</button></div></div>';
}
function attachPanel(kind,p){
  const list=kind==='org'?state.orgs:state.contacts;
  const arr=kind==='org'?p.orgIds:p.contactIds;
  if(!list.length)return '<div class="attach-panel"><p class="empty">Справочник пуст — <button class="linkbtn" data-action="goto-book">добавить →</button></p></div>';
  return '<div class="attach-panel">'+list.map(item=>{
    const sub=kind==='org'?(item.city||item.type||''):(item.position||'');
    return '<label class="attach-item"><input type="checkbox" data-action="attach-toggle" data-kind="'+kind+'" data-id="'+item.id+'"'+(arr.includes(item.id)?' checked':'')+'>'
     +'<span><b>'+esc(item.name)+'</b><small>'+esc(sub)+'</small></span></label>';
  }).join('')+'</div>';
}
function contactsTab(p){
  const po=p.orgIds.map(id=>state.orgs.find(o=>o.id===id)).filter(Boolean);
  const pc=p.contactIds.map(id=>state.contacts.find(c=>c.id===id)).filter(Boolean);
  return '<div class="contact-cols rise">'
   +'<section class="panel"><div class="panel-head"><h3>Организации проекта</h3>'
   +'<button class="btn ghost sm" data-action="attach-open" data-kind="org">'+(ui.openAttach==='org'?'Скрыть список':I.plus+' Добавить')+'</button></div>'
   +(po.length?po.map(orgRow).join(''):'<p class="empty">Организации пока не привязаны.</p>')
   +(ui.openAttach==='org'?attachPanel('org',p):'')+'</section>'
   +'<section class="panel"><div class="panel-head"><h3>Контакты проекта</h3>'
   +'<button class="btn ghost sm" data-action="attach-open" data-kind="contact">'+(ui.openAttach==='contact'?'Скрыть список':I.plus+' Добавить')+'</button></div>'
   +(pc.length?pc.map(contactRow).join(''):'<p class="empty">Контакты пока не привязаны.</p>')
   +(ui.openAttach==='contact'?attachPanel('contact',p):'')+'</section>'
   +'</div><p class="hint">База исполнителей для задач — в разделе <button class="linkbtn" data-action="goto-executors">Справочник → Исполнители</button></p>';
}

/* -------- заметки -------- */
const NOTE_COLORS=[['sun','#fbf0c4'],['rose','#fadfdc'],['sky','#dbe9f6'],['mint','#dcefe1'],['paper','#fffdf6']];
function noteCard(n){
  const editing=ui.editNote===n.id;
  return '<article class="note '+n.color+(n.pinned?' pinned':'')+'">'
   +'<button class="iconbtn sm pinbtn'+(n.pinned?' on':'')+'" title="'+(n.pinned?'Открепить':'Закрепить')+'" data-action="note-pin" data-id="'+n.id+'">'+I.pin+'</button>'
   +(editing
     ?'<textarea class="edit-ta" id="editNoteText">'+esc(n.text)+'</textarea><footer><button class="btn sm primary" data-action="note-save" data-id="'+n.id+'">Сохранить</button><button class="btn sm ghost" data-action="note-cancel">Отмена</button></footer>'
     :'<div class="note-text">'+esc(n.text)+'</div><footer><span>'+fmtLong(n.createdAt)+'</span><span class="note-btns">'
      +'<button title="Изменить" data-action="note-edit" data-id="'+n.id+'">'+I.pen+'</button>'
      +'<button title="Удалить" data-action="note-del" data-id="'+n.id+'">'+I.trash+'</button></span></footer>')
   +'</article>';
}
function notesTab(p){
  const notes=state.notes.filter(n=>n.projectId===p.id).sort((a,b)=>(b.pinned-a.pinned)||b.createdAt.localeCompare(a.createdAt));
  return '<div class="composer rise"><textarea id="noteText" placeholder="Быстрая мысль по проекту… (Enter — сохранить)">'+esc(ui.noteDraft)+'</textarea>'
   +'<div class="composer-row"><div class="swatches">'+NOTE_COLORS.map(c=>'<button class="sw'+(ui.noteColor===c[0]?' active':'')+'" style="--sw:'+c[1]+'" data-action="note-color" data-c="'+c[0]+'" title="Цвет"></button>').join('')+'</div>'
   +'<button class="btn primary" data-action="note-add">'+I.plus+' Сохранить заметку</button></div></div>'
   +'<div class="notes-grid rise" style="animation-delay:60ms">'+(notes.map(noteCard).join('')||'<p class="empty">Заметок пока нет — добавьте первую.</p>')+'</div>';
}
function addNote(){
  const ta=$('#noteText'),v=(ta?ta.value:'').trim();
  if(!v){toast('Напишите текст заметки','err');return;}
  state.notes.push({id:uid(),projectId:ui.projectId,text:v,color:ui.noteColor,pinned:false,createdAt:todayISO()});
  ui.noteDraft='';persist();refreshTab();toast('Заметка сохранена');
}

/* ================= справочник ================= */
function orgBookCard(o,i){
  const cnt=state.contacts.filter(c=>c.orgIds.includes(o.id)).length;
  const used=state.projects.filter(p=>p.orgIds.includes(o.id)).length;
  return '<article class="bcard rise" style="animation-delay:'+Math.min(i*60,360)+'ms">'
   +'<div class="bcard-head"><h3>'+esc(o.name)+'</h3>'+(o.type?'<span class="chip c-type">'+esc(o.type)+'</span>':'')+'</div>'
   +(o.city?'<p class="bline"><span class="dim">Город:</span> '+esc(o.city)+'</p>':'')
   +(o.phone?'<p class="bline">☎ '+esc(o.phone)+'</p>':'')
   +(o.email?'<p class="bline">✉ '+esc(o.email)+'</p>':'')
   +(o.note?'<p class="bnote">'+esc(o.note)+'</p>':'')
   +'<p class="bmeta">Контактов: '+cnt+' · в проектах: '+used+'</p>'
   +'<div class="bcard-actions"><button class="btn ghost sm" data-action="org-edit" data-id="'+o.id+'">'+I.pen+' Изменить</button>'

function contactBookCard(c,i){
  const orgs=state.orgs.filter(o=>c.orgIds.includes(o.id));
  return '<article class="bcard rise" style="animation-delay:'+Math.min(i*60,360)+'ms">'
   +'<div class="bcard-head"><h3>'+esc(c.name)+'</h3></div>'
   +(c.position?'<p class="bline">'+esc(c.position)+'</p>':'')
   +(orgs.length?'<p class="bline">'+orgs.map(o=>'<span class="chip c-type" style="margin:2px 4px 2px 0">'+esc(o.name)+'</span>').join('')+'</p>':'')
   +(c.phone?'<p class="bline">☎ '+esc(c.phone)+'</p>':'')
   +(c.email?'<p class="bline">✉ '+esc(c.email)+'</p>':'')
   +(c.note?'<p class="bnote">'+esc(c.note)+'</p>':'')
   +'<div class="bcard-actions"><button class="btn ghost sm" data-action="contact-edit" data-id="'+c.id+'">'+I.pen+' Изменить</button>'
   +'<button class="iconbtn danger-h" title="Удалить" data-action="contact-del" data-id="'+c.id+'">'+I.trash+'</button></div></article>';
}
function execBookCard(x,i){
  const cnt=execTasksCount(x.id);
  return '<article class="bcard rise" style="animation-delay:'+Math.min(i*60,360)+'ms">'
   +'<div class="bcard-head"><h3>'+esc(x.name)+'</h3>'+(x.role?'<span class="chip c-exec">'+esc(x.role)+'</span>':'')+'</div>'
   +(x.phone?'<p class="bline">☎ '+esc(x.phone)+'</p>':'')
   +(x.email?'<p class="bline">✉ '+esc(x.email)+'</p>':'')
   +(x.note?'<p class="bnote">'+esc(x.note)+'</p>':'')
   +'<p class="bmeta">Назначен задач: '+cnt+'</p>'
   +'<div class="bcard-actions"><button class="btn ghost sm" data-action="exec-edit" data-id="'+x.id+'">'+I.pen+' Изменить</button>'
   +'<button class="iconbtn danger-h" title="Удалить" data-action="exec-del" data-id="'+x.id+'">'+I.trash+'</button></div></article>';
}
function vBook(){
  const o=state.orgs,c=state.contacts,ex=state.executors;
  let body='';
  if(ui.bookTab==='orgs')body=o.map(orgBookCard).join('')||'<div class="empty-big"><p>Организаций пока нет.</p></div>';
  else if(ui.bookTab==='contacts')body=c.map(contactBookCard).join('')||'<div class="empty-big"><p>Контактов пока нет.</p></div>';
  else body=ex.map(execBookCard).join('')||'<div class="empty-big"><p>Исполнителей пока нет.</p><p style="margin-top:6px;font-size:13px;color:var(--mut)">Это коллеги, которых вы назначаете на задачи в проектах.</p></div>';
  return '<div class="wrap">'
   +'<section class="book-head rise"><div><p class="kicker">Справочник</p><h1>Партнёры и команда</h1>'
   +'<p class="lede small">Организации и контакты — для проектов. Исполнители — коллеги, которых можно назначать на задачи.</p></div>'
   +'<div class="row-gap"><button class="btn ghost" data-action="org-new">'+I.plus+' Организация</button>'
   +'<button class="btn ghost" data-action="contact-new">'+I.plus+' Контакт</button>'
   +'<button class="btn primary" data-action="exec-new">'+I.plus+' Исполнитель</button></div></section>'
   +'<nav class="ptabs rise" style="animation-delay:60ms">'
   +'<button class="ptab'+(ui.bookTab==='orgs'?' active':'')+'" data-action="book-tab" data-tab="orgs">Организации <span class="cnt">'+o.length+'</span></button>'
   +'<button class="ptab'+(ui.bookTab==='contacts'?' active':'')+'" data-action="book-tab" data-tab="contacts">Контакты <span class="cnt">'+c.length+'</span></button>'
   +'<button class="ptab'+(ui.bookTab==='execs'?' active':'')+'" data-action="book-tab" data-tab="execs">Исполнители <span class="cnt">'+ex.length+'</span></button></nav>'
   +'<div class="bgrid">'+body+'</div>'
   +'</div>';
}

/* ================= рендер ================= */
function renderApp(){
  const app=$('#app');
  if(ui.view==='project')app.innerHTML=vProject();
  else if(ui.view==='book')app.innerHTML=vBook();
  else app.innerHTML=vDashboard();
  syncNav();
}
function syncNav(){
  const d=$('#navDash'),b=$('#navBook');
  if(d)d.classList.toggle('active',ui.view!=='book');
  if(b)b.classList.toggle('active',ui.view==='book');
}
function refreshTab(){
  const nt=$('#noteText');if(nt)ui.noteDraft=nt.value;
  const p=cur(),body=$('#tabBody');
  if(p&&body)body.innerHTML=renderTab(p);
  updateTabButtons();
}
function updateTabButtons(){
  if(ui.view!=='project')return;
  $$('.ptabs .ptab').forEach(b=>b.classList.toggle('active',b.dataset.tab===ui.tab));
}

/* ================= модалки ================= */
function openModal(html,cls){
  $('#modalRoot').innerHTML='<div class="overlay"><div class="modal '+(cls||'')+'">'+html+'</div></div>';
}
function closeModal(){$('#modalRoot').innerHTML='';}
function askConfirm(text,ok){
  openModal('<h3>Подтверждение</h3><p class="confirm-text">'+text+'</p>'
   +'<div class="modal-actions"><button class="btn ghost" data-action="modal-close">Отмена</button>'
   +'<button class="btn danger" id="confirmOk">Удалить</button></div>','modal-sm');
  $('#confirmOk').addEventListener('click',()=>{closeModal();ok();});
}
function openNewProject(){
  openModal('<h3>Новый проект</h3>'
   +'<label>Название проекта *<input id="np-name" maxlength="90" placeholder="Например: Выставка пионов"></label>'
   +'<label>Партнёр<input id="np-org" list="orgList" placeholder="Выберите из списка или введите новую"><datalist id="orgList">'
   +state.orgs.map(o=>'<option value="'+esc(o.name)+'">').join('')+'</datalist></label>'
   +'<div class="grid3"><label>Дата выдачи (ДВ) *<input type="date" id="np-dv"></label>'
   +'<label>Открытие<input type="date" id="np-open" title="Можно оставить пустым — подставится дата выдачи"></label>'
   +'<label>Возврат<input type="date" id="np-ret"></label></div>'
   +'<p class="modal-hint">Дедлайны всех этапов рассчитаются автоматически от даты выдачи и даты возврата.</p>'
   +'<div class="modal-actions"><button class="btn ghost" data-action="modal-close">Отмена</button>'
   +'<button class="btn primary" data-action="np-create">Создать проект</button></div>');
  $('#np-dv').value=addDaysISO(todayISO(),60);
  $('#np-name').focus();
}
function createProject(){
  const name=$('#np-name').value.trim(),dv=$('#np-dv').value;
  if(!name){toast('Укажите название проекта','err');return;}
  if(!dv){toast('Укажите дату выдачи','err');return;}
  const orgName=$('#np-org').value.trim();
  let orgId=null;
  if(orgName){
    let o=state.orgs.find(x=>x.name.toLowerCase()===orgName.toLowerCase());
    if(!o){o={id:uid(),name:orgName,type:'Другое',city:'',phone:'',email:'',note:''};state.orgs.push(o);}
    orgId=o.id;
  }
  const p={id:uid(),name:name,orgId:orgId,dv:dv,open:$('#np-open').value||'',ret:$('#np-ret').value||'',stages:makeStages(),orgIds:orgId?[orgId]:[],contactIds:[]};
  state.projects.unshift(p);persist();closeModal();
  ui.view='project';ui.projectId=p.id;ui.tab='stages';ui.openAttach=null;
  renderApp();window.scrollTo(0,0);toast('Проект создан — дедлайны рассчитаны');
}
const ORG_TYPES=['Музей','Галерея','Частная коллекция','Фонд','Театр','Другое'];
function openOrgModal(org){
  openModal('<h3>'+(org?'Изменить организацию':'Новая организация')+'</h3>'
   +'<label>Название *<input id="m-name" maxlength="90" placeholder="Например: Музей цветов"></label>'
   +'<div class="grid2"><label>Тип<select id="m-type">'+ORG_TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></label>'
   +'<label>Город<input id="m-city" maxlength="60" placeholder="Москва"></label></div>'
   +'<div class="grid2"><label>Телефон<input id="m-phone" placeholder="+7 …"></label>'
   +'<label>E-mail<input id="m-email" placeholder="mail@…"></label></div>'
   +'<label>Заметка<textarea id="m-note" rows="2" placeholder="Особенности сотрудничества…"></textarea></label>'
   +'<div class="modal-actions"><button class="btn ghost" data-action="modal-close">Отмена</button>'
   +'<button class="btn primary" data-action="org-save" data-id="'+(org?org.id:'')+'">'+(org?'Сохранить':'Добавить')+'</button></div>');
  if(org){
    $('#m-name').value=org.name||'';$('#m-type').value=org.type||ORG_TYPES[0];
    $('#m-city').value=org.city||'';$('#m-phone').value=org.phone||'';
    $('#m-email').value=org.email||'';$('#m-note').value=org.note||'';
  }
  $('#m-name').focus();
}
function saveOrg(id){
  const name=$('#m-name').value.trim();
  if(!name){toast('Укажите название','err');return;}
  const data={name:name,type:$('#m-type').value,city:$('#m-city').value.trim(),phone:$('#m-phone').value.trim(),email:$('#m-email').value.trim(),note:$('#m-note').value.trim()};
  if(id){const o=state.orgs.find(x=>x.id===id);if(o)Object.assign(o,data);}
  else state.orgs.push(Object.assign({id:uid()},data));
  persist();closeModal();renderApp();toast('Сохранено');
}
function renderModalOrgChips(){
  const box=$('#m-orgchips');if(!box)return;
  box.innerHTML=contactModalOrgs.length
    ? contactModalOrgs.map(oid=>{
        const o=state.orgs.find(x=>x.id===oid);if(!o)return '';
        return '<span class="org-sel-chip">'+esc(o.name)+'<button type="button" class="osc-x" data-action="m-org-remove" data-id="'+oid+'" title="Убрать">'+I.x+'</button></span>';
      }).join('')
    : '<span class="empty">Организации не выбраны</span>';
}
function openContactModal(c){
  contactModalOrgs=(c&&c.orgIds?c.orgIds.slice():[]).filter(id=>state.orgs.some(o=>o.id===id));
  const pickerHtml=state.orgs.length
    ? '<div class="org-picker"><select id="m-orgsel"><option value="">— выберите организацию —</option>'
      +state.orgs.map(o=>'<option value="'+o.id+'">'+esc(o.name)+'</option>').join('')
      +'</select><button class="btn ghost sm" id="m-orgadd" type="button">'+I.plus+' Добавить</button></div>'
      +'<div id="m-orgchips" class="org-chips"></div>'
    : '<p class="empty" style="margin-bottom:12px">Справочник организаций пуст — сначала добавьте организацию.</p>';
  openModal('<h3>'+(c?'Изменить контакт':'Новый контакт')+'</h3>'
   +'<label>ФИО *<input id="m-fio" maxlength="90" placeholder="Имя Фамилия"></label>'
   +'<label>Должность<input id="m-pos" maxlength="90" placeholder="Куратор, хранитель…"></label>'
   +'<label>Организации</label>'
   +pickerHtml
   +'<div class="grid2"><label>Телефон<input id="m-phone" placeholder="+7 …"></label>'
   +'<label>E-mail<input id="m-email" placeholder="mail@…"></label></div>'
   +'<label>Заметка<textarea id="m-note" rows="2" placeholder="Например: главный контакт по договорам"></textarea></label>'
   +'<div class="modal-actions"><button class="btn ghost" data-action="modal-close">Отмена</button>'
   +'<button class="btn primary" data-action="contact-save" data-id="'+(c?c.id:'')+'">'+(c?'Сохранить':'Добавить')+'</button></div>');
  if(c){
    $('#m-fio').value=c.name||'';$('#m-pos').value=c.position||'';
    $('#m-phone').value=c.phone||'';$('#m-email').value=c.email||'';$('#m-note').value=c.note||'';
  }
  if(state.orgs.length){
    renderModalOrgChips();
    $('#m-orgadd').addEventListener('click',()=>{
      const sel=$('#m-orgsel');const v=sel.value;
      if(v&&!contactModalOrgs.includes(v)){contactModalOrgs.push(v);renderModalOrgChips();}
      sel.value='';
    });
  }
  $('#m-fio').focus();
}

   +'<label>Организация-партнёр<select id="pt-sel">'
   +'<option value="">— Без партнёра —</option>'
   +state.orgs.map(o=>'<option value="'+o.id+'"'+(p.orgId===o.id?' selected':'')+'>'+esc(o.name)+(o.city?' ('+esc(o.city)+')':'')+'</option>').join('')
   +'<option value="__new">➕ Создать новую организацию…</option>'
   +'</select></label>'
   +'<div id="pt-new-wrap" style="display:none"><label>Название новой организации *<input id="pt-new-name" maxlength="90" placeholder="Например: Краеведческий музей"></label></div>'
   +'<p class="modal-hint">Выбранная организация автоматически появится в списке организаций проекта на вкладке «Контакты».</p>'
   +'<div class="modal-actions"><button class="btn ghost" data-action="modal-close">Отмена</button>'
   +'<button class="btn primary" data-action="pt-save">Сохранить</button></div>');
  $('#pt-sel').addEventListener('change',()=>{
    $('#pt-new-wrap').style.display=$('#pt-sel').value==='__new'?'':'none';
    if($('#pt-sel').value==='__new')$('#pt-new-name').focus();
  });
}
function savePartner(){
  const p=cur();if(!p)return;
  const v=$('#pt-sel').value;
  if(v==='__new'){
    const name=$('#pt-new-name').value.trim();
    if(!name){toast('Укажите название организации','err');return;}
    let o=state.orgs.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!o){o={id:uid(),name:name,type:'Другое',city:'',phone:'',email:'',note:''};state.orgs.push(o);}
    p.orgId=o.id;
    if(!p.orgIds.includes(o.id))p.orgIds.push(o.id);
  }else if(v===''){
    p.orgId=null;
  }else{
    p.orgId=v;
    if(!p.orgIds.includes(v))p.orgIds.push(v);
  }
  persist();closeModal();renderApp();toast('Партнёр проекта обновлён');
}
function delOrg(id){
  const o=state.orgs.find(x=>x.id===id);if(!o)return;
  askConfirm('Удалить организацию «'+esc(o.name)+'»? Она будет отвязана от проектов и контактов.',()=>{
    state.orgs=state.orgs.filter(x=>x.id!==id);
    state.projects.forEach(p=>{p.orgIds=(p.orgIds||[]).filter(x=>x!==id);if(p.orgId===id)p.orgId=null;});
    state.contacts.forEach(c=>c.orgIds=(c.orgIds||[]).filter(x=>x!==id));
    persist();renderApp();toast('Организация удалена');
  });
}
function delContact(id){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  askConfirm('Удалить контакт «'+esc(c.name)+'»? Он будет отвязан от проектов.',()=>{
    state.contacts=state.contacts.filter(x=>x.id!==id);
    state.projects.forEach(p=>p.contactIds=(p.contactIds||[]).filter(x=>x!==id));
    persist();renderApp();toast('Контакт удалён');
  });
}
function delExec(id){
  const x=state.executors.find(e=>e.id===id);if(!x)return;
  askConfirm('Удалить исполнителя «'+esc(x.name)+'»? Он будет снят со всех задач.',()=>{
    state.executors=state.executors.filter(e=>e.id!==id);
    state.projects.forEach(p=>p.stages.forEach(s=>s.tasks.forEach(t=>{if((t.assigneeId||'')===id)t.assigneeId='';})));
    persist();renderApp();toast('Исполнитель удалён');
  });
}
function deleteProject(){
  const p=cur();if(!p)return;
  askConfirm('Удалить проект «'+esc(p.name)+'» вместе с заметками? Это действие необратимо.',()=>{
    state.projects=state.projects.filter(x=>x.id!==p.id);
    state.notes=state.notes.filter(n=>n.projectId!==p.id);
    persist();ui.view='dash';renderApp();toast('Проект удалён');
  });
}

/* ================= экспорт / импорт / тосты ================= */
function exportData(){
  const blob=new Blob([JSON.stringify({app:'Такие дела',version:'1.8',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='takie-dela-'+todayISO()+'.json';a.click();
  URL.revokeObjectURL(a.href);toast('Резервная копия скачана');
}
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),d=j.data||j;
      if(!Array.isArray(d.projects))throw new Error('bad');
      state=normalize(d);
      migrateAll();
      persist();ui.view='dash';ui.projectId=null;renderApp();toast('Данные импортированы');
    }catch(e){toast('Не удалось прочитать файл','err');}
  };
  r.readAsText(file);
}
function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast'+(type==='err'?' err':'');el.textContent=msg;
  $('#toasts').append(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),320);},2600);
}

/* ================= события ================= */
function onClick(e){
  if(e.target.classList&&e.target.classList.contains('overlay')){closeModal();return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id,p=cur();
  switch(a){
    case 'nav-dash':ui.view='dash';renderApp();window.scrollTo(0,0);break;
    case 'nav-book':ui.view='book';renderApp();window.scrollTo(0,0);break;
    case 'new-project':openNewProject();break;
    case 'open-project':ui.view='project';ui.projectId=id;ui.tab='stages';ui.openAttach=null;ui.addingStage=null;ui.editStage=null;ui.editTask=null;renderApp();window.scrollTo(0,0);break;
    case 'back':ui.view='dash';renderApp();window.scrollTo(0,0);break;
    case 'rename-start':startRename();break;
    case 'delete-project':deleteProject();break;
    case 'partner-edit':openPartnerModal();break;
    case 'pt-save':savePartner();break;
    case 'tab':ui.tab=el.dataset.tab;ui.openAttach=null;ui.addingStage=null;ui.editStage=null;ui.editTask=null;refreshTab();break;
    case 'task-add':ui.addingStage=+el.dataset.stage;ui.editTask=null;replaceStages();focusTaskAdd();break;
    case 'task-add-cancel':ui.addingStage=null;replaceStages();break;
    case 'task-edit':ui.editTask={stage:+el.dataset.stage,id:el.dataset.id};ui.editStage=null;ui.addingStage=null;replaceStages();focusTaskEdit();break;
    case 'stage-title-edit':ui.editStage=+el.dataset.stage;ui.editTask=null;replaceStages();focusStageTitle();break;
    case 'task-del':{
      const s=p.stages[+el.dataset.stage];
      s.tasks=s.tasks.filter(t=>t.id!==id);
      persist();replaceStages();toast('Задача удалена');break;
    }
    case 'stage-toggle-all':{
      const s=p.stages[+el.dataset.stage];
      const all=s.tasks.every(t=>t.done);
      s.tasks.forEach(t=>t.done=!all);
      persist();replaceStages();break;
    }
    case 'attach-open':{
      const k=el.dataset.kind;
      ui.openAttach=ui.openAttach===k?null:k;refreshTab();break;
    }
    case 'attach-remove':{
      const arr=el.dataset.kind==='org'?p.orgIds:p.contactIds;
      const idx=arr.indexOf(id);if(idx>-1)arr.splice(idx,1);
      persist();refreshTab();break;
    }
    case 'goto-book':ui.view='book';ui.bookTab='orgs';renderApp();window.scrollTo(0,0);break;
    case 'goto-executors':ui.view='book';ui.bookTab='execs';renderApp();window.scrollTo(0,0);break;
    case 'org-edit':{const o=state.orgs.find(x=>x.id===id);if(o)openOrgModal(o);break;}
    case 'contact-edit':{const c=state.contacts.find(x=>x.id===id);if(c)openContactModal(c);break;}
    case 'exec-edit':{const x=state.executors.find(e=>e.id===id);if(x)openExecModal(x);break;}
    case 'org-del':delOrg(id);break;
    case 'contact-del':delContact(id);break;
    case 'exec-del':delExec(id);break;
    case 'org-new':openOrgModal();break;
    case 'contact-new':openContactModal();break;
    case 'exec-new':openExecModal();break;
    case 'book-tab':ui.bookTab=el.dataset.tab;renderApp();break;
    case 'modal-close':closeModal();break;
    case 'm-org-remove':{const idx=contactModalOrgs.indexOf(id);if(idx>-1)contactModalOrgs.splice(idx,1);renderModalOrgChips();break;}
    case 'np-create':createProject();break;
    case 'org-save':saveOrg(el.dataset.id);break;
    case 'contact-save':saveContact(el.dataset.id);break;
    case 'exec-save':saveExec(el.dataset.id);break;
    case 'export':exportData();break;
    case 'import':$('#fileInput').click();break;
    case 'note-color':ui.noteColor=el.dataset.c;$$('.sw').forEach(s=>s.classList.toggle('active',s.dataset.c===ui.noteColor));break;
    case 'note-add':addNote();break;
    case 'note-pin':{const n=state.notes.find(x=>x.id===id);if(n){n.pinned=!n.pinned;persist();refreshTab();}break;}
    case 'note-edit':ui.editNote=id;refreshTab();{const ta=$('#editNoteText');if(ta){ta.focus();ta.selectionStart=ta.value.length;}}break;
    case 'note-save':{
      const n=state.notes.find(x=>x.id===id),ta=$('#editNoteText');
      if(n&&ta){const v=ta.value.trim();if(v)n.text=v;}
      ui.editNote=null;persist();refreshTab();break;
    }
    case 'note-cancel':ui.editNote=null;refreshTab();break;
    case 'note-del':askConfirm('Удалить заметку?',()=>{state.notes=state.notes.filter(x=>x.id!==id);persist();refreshTab();toast('Заметка удалена');});break;
  }
}
function onChange(e){
  const el=e.target,a=el.dataset.action;
  if(a==='task-toggle'){
    const p=cur();if(!p)return;
    const s=p.stages[+el.dataset.stage],t=s.tasks.find(x=>x.id===el.dataset.id);
    if(!t)return;
    const wasAll=s.tasks.every(x=>x.done);
    t.done=el.checked;
    const nowAll=s.tasks.every(x=>x.done);
    persist();
    const li=el.closest('.task');if(li)li.classList.toggle('done',t.done);
    updateStageChip(+el.dataset.stage);updateProjectProgress();
    if(wasAll!==nowAll)setTimeout(replaceStages,450);
  }else if(a==='task-assign'){
    const p=cur();if(!p)return;
    const s=p.stages[+el.dataset.stage],t=s.tasks.find(x=>x.id===el.dataset.id);
    if(!t)return;
    t.assigneeId=el.value||'';
    persist();
    el.classList.toggle('has',!!t.assigneeId);
    if(t.assigneeId){const x=execById(t.assigneeId);if(x)toast('Исполнитель: '+x.name);}
  }else if(a==='set-date'){
    const p=cur();if(!p)return;
    p[el.dataset.field]=el.value||'';
    persist();renderApp();toast('Даты обновлены — дедлайны пересчитаны');
  }else if(a==='attach-toggle'){
    const p=cur();if(!p)return;
    const arr=el.dataset.kind==='org'?p.orgIds:p.contactIds;
    const i=arr.indexOf(el.dataset.id);
    if(el.checked&&i===-1)arr.push(el.dataset.id);
    if(!el.checked&&i>-1)arr.splice(i,1);
    persist();refreshTab();
  }
}
function onFocusIn(e){
  const el=e.target;
  if(!el||!el.dataset||el.dataset.action!=='set-date')return;
  const p=cur();if(!p||el.value)return;
  const f=el.dataset.field;
  const def=f==='open'?p.dv:(f==='ret'?(p.open||p.dv):null);
  if(def){
    el.value=def;p[f]=def;
    persist();refreshTab();
  }
}
function onKey(e){
  if(e.target&&e.target.id==='noteText'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();addNote();}
  if(e.key==='Escape'&&$('#modalRoot').firstChild)closeModal();
}

/* ================= шапка и старт ================= */
function headerHTML(){
  return '<div class="hdr-in">'
   +'<button class="logo" data-action="nav-dash" title="На главную">'
   +'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M4.2 6.5l15.6 11M19.8 6.5L4.2 17.5"/></svg>Такие дела</button>'
   +'<nav class="mainnav"><button id="navDash" class="nbtn" data-action="nav-dash">Проекты</button>'
   +'<button id="navBook" class="nbtn" data-action="nav-book">Справочник</button></nav>'
   +'<div class="hdr-right"><div class="save-ind" title="Данные сохраняются в браузере автоматически"><span class="dot" id="saveDot"></span><span id="saveTxt">автосохранение</span></div>'
   +'<button class="btn ghost sm" data-action="import" title="Загрузить резервную копию JSON">'+I.ul+'<span>Импорт</span></button>'
   +'<button class="btn ghost sm" data-action="export" title="Скачать резервную копию JSON">'+I.dl+'<span>Экспорт</span></button></div></div>';
}
function init(){
  $('#hdr').innerHTML=headerHTML();
  load();
  migrateAll();
  renderApp();
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('focusin',onFocusIn);
  document.addEventListener('keydown',onKey);
  $('#fileInput').addEventListener('change',e=>{
    if(e.target.files&&e.target.files[0])importFile(e.target.files[0]);
    e.target.value='';
  });
}
init();
</script>
</body>
</html>
