<style>
:root{
  --bg:#f6f2ea; --surface:#fffcf6; --surface2:#f8f3e9;
  --ink:#272219; --ink2:#5c5546; --mut:#958a70;
  --line:rgba(39,34,25,.16); --line-soft:rgba(39,34,25,.09);
  --accent:#c14e24; --accent-soft:rgba(193,78,36,.11);
  --green:#3e7d5a; --green-soft:rgba(62,125,90,.13);
  --amber:#a9761c; --amber-soft:rgba(176,122,30,.15);
  --red:#b3392f; --red-soft:rgba(179,57,47,.11);
  --blue:#41628e; --blue-soft:rgba(65,98,142,.13);
  --shadow:0 1px 2px rgba(39,34,25,.05),0 10px 26px -14px rgba(39,34,25,.2);
  --r:12px;
  --display:'Spectral',Georgia,'Times New Roman',serif;
  --body:'Golos Text',-apple-system,'Segoe UI',sans-serif;
}
[data-theme="dark"]{
  --bg:#1a1814; --surface:#24201a; --surface2:#2c2820;
  --ink:#e8e4dc; --ink2:#c8c0b0; --mut:#9a8f7a;
  --line:rgba(232,228,220,.18); --line-soft:rgba(232,228,220,.10);
  --accent:#d97a4f; --accent-soft:rgba(217,122,79,.16);
  --green:#5aa57a; --green-soft:rgba(90,165,122,.16);
  --amber:#d9a54f; --amber-soft:rgba(217,165,79,.18);
  --red:#d95a4f; --red-soft:rgba(217,90,79,.16);
  --blue:#6a8fb9; --blue-soft:rgba(106,143,185,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font:400 15px/1.5 var(--body); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(1100px 560px at 88% -10%, rgba(193,78,36,.08), transparent 60%),
    radial-gradient(900px 520px at -8% 24%, rgba(62,125,90,.07), transparent 60%),
    var(--bg);
  transition:background .3s,color .3s;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(39,34,25,.055) 1px,transparent 1px);background-size:23px 23px;}
[data-theme="dark"] body::before{background-image:radial-gradient(rgba(232,228,220,.05) 1px,transparent 1px)}
body::after{content:'✳';position:fixed;right:-7vw;bottom:-14vh;font-size:46vh;line-height:1;
  color:rgba(193,78,36,.05);pointer-events:none;z-index:0;}
header,main,footer{position:relative;z-index:1}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(246,242,234,.88);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);transition:background .3s,border-color .3s}
[data-theme="dark"] header{background:rgba(26,24,20,.85)}
.hdr-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font:700 19px var(--display);color:var(--ink);
  background:none;border:none;cursor:pointer}
.logo svg{color:var(--accent);animation:spin 32s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mainnav{display:flex;gap:4px}
.nbtn{position:relative;background:none;border:none;padding:8px 10px;font:600 14px var(--body);
  color:var(--ink2);cursor:pointer;border-radius:8px;transition:color .15s}
.nbtn:hover{color:var(--accent)}
.nbtn.active{color:var(--ink)}
.nbtn.active::after{content:'';position:absolute;left:10px;right:10px;bottom:2px;height:2.5px;
  border-radius:2px;background:var(--accent)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
  border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  cursor:pointer;transition:.15s;font-size:15px;line-height:1}
.theme-toggle:hover{background:var(--surface2);color:var(--accent);border-color:var(--accent)}
.save-ind{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);padding-right:4px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.pulse{animation:pulse .9s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,125,90,.5)}100%{box-shadow:0 0 0 9px rgba(62,125,90,0)}}

/* ---------- buttons / chips / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:9px;padding:9px 16px;
  font:600 14px var(--body);cursor:pointer;transition:.18s;line-height:1}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 16px -8px rgba(193,78,36,.55)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;
  border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer;transition:.15s}
.iconbtn:hover{background:var(--surface2);color:var(--accent);border-color:var(--line-soft)}
.iconbtn.danger-h:hover{color:var(--red)}
.iconbtn.sm{width:26px;height:26px}
.linkbtn{background:none;border:none;color:var(--ink2);font:600 13px var(--body);cursor:pointer;
  display:inline-flex;gap:5px;align-items:center;padding:4px 0;transition:color .15s}
.linkbtn:hover{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.c-blue{background:var(--blue-soft);color:var(--blue)}
.c-green{background:var(--green-soft);color:var(--green)}
.c-amber{background:var(--amber-soft);color:var(--amber)}
.c-red{background:var(--red-soft);color:var(--red)}
.c-muted{background:var(--line-soft);color:var(--ink2)}
.c-type{background:var(--surface2);color:var(--ink2);border:1px solid var(--line-soft)}
.c-exec{background:var(--blue-soft);color:var(--blue)}
.dirchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none}
.d-vyd{background:var(--green-soft);color:var(--green)}
.d-dog{background:var(--accent-soft);color:var(--accent)}
.d-museum{background:var(--blue-soft);color:var(--blue)}
.hint{color:var(--mut);font-size:13px;margin:14px 2px;line-height:1.5}
.empty{color:var(--mut);font-size:13.5px;padding:6px 0}
.dim2{color:var(--mut)}
.rise{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- приоритет ---------- */
.prio{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;
  font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent;cursor:pointer;
  transition:.15s;white-space:nowrap;flex:none;line-height:1.4}
.prio i{width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none}
.prio:hover{transform:translateY(-1px);box-shadow:0 3px 8px -3px rgba(39,34,25,.3)}
.p-fire{background:var(--red-soft);color:var(--red);border-color:rgba(179,57,47,.28)}
.p-fire i{animation:priopulse 1.5s infinite}
@keyframes priopulse{0%,100%{box-shadow:0 0 0 0 rgba(179,57,47,.45)}50%{box-shadow:0 0 0 4px rgba(179,57,47,0)}}
.p-important{background:var(--amber-soft);color:var(--amber);border-color:rgba(176,122,30,.32)}
.p-normal{background:var(--blue-soft);color:var(--blue);border-color:rgba(65,98,142,.26)}
.p-background{background:rgba(149,138,112,.15);color:var(--mut);border-color:rgba(149,138,112,.32)}
.p-pause{background:var(--line-soft);color:var(--ink2);border-color:var(--line)}
.prio-backdrop{position:fixed;inset:0;z-index:95}
.prio-menu{position:fixed;z-index:96;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 16px 36px -12px rgba(0,0,0,.35);padding:5px;width:176px;animation:pop .18s cubic-bezier(.2,.9,.3,1.15)}
.prio-menu-cap{font:800 10.5px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--mut);padding:5px 10px 6px}
.prio-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:none;background:none;
  border-radius:7px;font:600 13px var(--body);color:var(--ink2);cursor:pointer;text-align:left;transition:.12s}
.prio-item i{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.prio-item:hover{background:var(--surface2);color:var(--ink)}
.prio-item.active{background:var(--accent-soft);color:var(--accent)}
.pm-check{margin-left:auto;font-weight:800}

/* ---------- hero / dashboard ---------- */
.hero{padding:34px 0 6px}
.kicker{text-transform:uppercase;letter-spacing:.15em;font-size:11.5px;font-weight:700;color:var(--accent)}
.hero h1{font:700 clamp(36px,5.4vw,58px)/1.05 var(--display);margin:8px 0 10px}
.ast{color:var(--accent);display:inline-block;margin-left:10px;animation:spin 26s linear infinite;transform-origin:center}
.lede{color:var(--ink2);font-size:16.5px;max-width:660px;line-height:1.55}
.lede.small{font-size:14.5px}
.stats{display:flex;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--shadow);margin:22px 0 8px;overflow:hidden}
.stat{flex:1;min-width:0;padding:10px 16px;display:flex;align-items:center;gap:10px;transition:background .2s}
.stat:hover{background:var(--surface2)}
.stat + .stat{border-left:1px solid var(--line-soft)}
.stat b{font:700 22px/1 var(--display);flex:none}
.stat:nth-child(3) b{color:var(--blue)}
.stat:nth-child(4) b{color:var(--accent)}
.stat-tx{min-width:0}
.stat-tx span{display:block;font-weight:700;font-size:12px;color:var(--ink2);line-height:1.25;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-transform:lowercase}
.stat-tx small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-btn{border:none;cursor:pointer;text-align:left;appearance:none}
.stat-btn .s-ic{flex:none;display:flex;color:var(--mut);transition:.2s}
.stat-btn:hover .s-ic{color:var(--accent);transform:translateY(-1px)}
.stat-btn.on{background:var(--accent-soft)}
.stat-btn.on:hover{background:var(--accent-soft)}
.stat-btn.on .s-ic{color:var(--accent)}
.stat-btn.on .stat-tx span{color:var(--accent)}
.f-dot{width:15px;height:15px;border-radius:50%;display:block}
.dash-bar{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap}
.dash-bar h2{font:700 26px var(--display)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:16px;margin-top:14px}
.pcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,opacity .25s;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),#d97a3f);opacity:0;transition:.25s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 18px 34px -16px rgba(39,34,25,.3)}
.pcard:hover::before{opacity:1}
.pcard.pc-vyd{background:#edf4ea;border-color:rgba(62,125,90,.22)}
.pcard.pc-vyd::before{background:linear-gradient(90deg,var(--green),#6ea583)}
.pcard.pc-dog{background:#fcefe1;border-color:rgba(193,78,36,.22)}
.pcard.pc-dog::before{background:linear-gradient(90deg,var(--accent),#e0854f)}
.pcard.pc-museum{background:#e3edf7;border-color:rgba(65,98,142,.22)}
.pcard.pc-museum::before{background:linear-gradient(90deg,var(--blue),#7fa3cc)}
[data-theme="dark"] .pcard.pc-vyd{background:rgba(90,165,122,.10);border-color:rgba(90,165,122,.3)}
[data-theme="dark"] .pcard.pc-dog{background:rgba(217,122,79,.10);border-color:rgba(217,122,79,.3)}
[data-theme="dark"] .pcard.pc-museum{background:rgba(106,143,185,.10);border-color:rgba(106,143,185,.3)}
.pcard.is-done{opacity:.78}
.pcard.is-done:hover{opacity:1}
.pcard-top{display:flex;justify-content:flex-end;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pcard-left{margin-right:auto;display:inline-flex;gap:6px;align-items:center;min-width:0;max-width:62%}
.pcard-left .orgchip{max-width:170px}
.orgchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink2);background:var(--surface2);border:1px solid var(--line-soft);
  padding:3px 9px;border-radius:999px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgchip svg{width:12px;height:12px;flex:none}
button.orgchip{cursor:pointer;transition:.15s}
button.orgchip:hover{color:var(--accent);border-color:var(--accent)}
.orgchip.dashed{border-style:dashed;color:var(--mut)}
.orgchip.dashed:hover{color:var(--blue);border-color:var(--blue)}
.chip-caret{font-size:9px;opacity:.65;margin-left:2px}
.pcard-title{font:700 21px/1.2 var(--display);margin:2px 0 10px;transition:color .2s}
.pcard:hover .pcard-title{color:var(--accent)}
.pcard-dv{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);margin-bottom:11px;flex-wrap:wrap}
.pcard-dv svg{color:var(--mut);flex:none}
.pcard-dv .cd{margin-left:auto;color:var(--accent);font-weight:700;white-space:nowrap}
.pbar{height:7px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.pbar i.f-prep{background:linear-gradient(90deg,var(--accent),#d97a3f)}
.pbar i.f-out{background:var(--green)}
.pbar i.f-late{background:var(--amber)}
.pbar i.f-done{background:var(--ink2)}
.pcard-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-top:9px}
.overbadge{color:var(--red);font-weight:700}
.empty-big{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink2);
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty-big p{margin-bottom:16px}
.pgrid-divider{grid-column:1/-1;display:flex;align-items:center;gap:12px;color:var(--mut);
  font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 0}
.pgrid-divider::before,.pgrid-divider::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- project view ---------- */
.proj-head{padding-top:24px}
.title-line{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:14px;flex-wrap:wrap}
.proj-title{font:700 clamp(24px,3.4vw,34px)/1.15 var(--display);cursor:pointer;display:flex;gap:10px;align-items:center}
.proj-title .pen{opacity:0;color:var(--mut);transition:.2s;display:inline-flex}
.proj-title:hover .pen{opacity:1;color:var(--accent)}
.rename-input{font:700 clamp(24px,3.4vw,34px) var(--display);border:none;border-bottom:2px solid var(--accent);
  background:transparent;outline:none;width:100%;padding:0 0 2px;color:var(--ink)}
.title-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dates-line{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:16px}
.datefield{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.datefield input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font:500 13.5px var(--body);color:var(--ink);outline:none;transition:.15s;color-scheme:light}
[data-theme="dark"] .datefield input{color-scheme:dark}
.datefield input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cd-banner{margin-left:auto;display:flex;align-items:baseline;gap:9px;padding:10px 18px;border-radius:12px;
  background:var(--accent-soft);color:var(--accent)}
.cd-banner b{font:700 30px/1 var(--display)}
.cd-banner span{font-size:13px;font-weight:600}
.cd-banner.out{background:var(--green-soft);color:var(--green)}
.cd-banner.today{background:var(--amber-soft);color:var(--amber)}
.cd-banner.ret{background:var(--line-soft);color:var(--ink2)}
.cd-banner.over{background:var(--red-soft);color:var(--red)}
.proj-progress{display:flex;align-items:center;gap:14px;margin-top:16px}
.ptrack{flex:1;height:9px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.ptrack i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#d97a3f);
  border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
#projStatsTx{font-size:13px;color:var(--ink2);white-space:nowrap}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:24px 0 18px;overflow-x:auto}
.ptab{position:relative;background:none;border:none;padding:10px 2px 12px;font:600 15px var(--body);
  color:var(--ink2);cursor:pointer;white-space:nowrap}
.ptab::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);
  border-radius:3px 3px 0 0;transform:scaleX(0);transition:transform .25s}
.ptab.active{color:var(--ink)}
.ptab.active::after{transform:scaleX(1)}
.ptab:hover{color:var(--accent)}
.cnt{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px;font-size:12px;margin-left:5px}

/* ---------- stages ---------- */
.stage{display:grid;grid-template-columns:46px 1fr;gap:14px;background:var(--surface);
  border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;transition:box-shadow .2s}
.stage:hover{box-shadow:var(--shadow)}
.stage.st-over{border-left-color:var(--red)}
.stage.st-done{border-left-color:var(--green)}
.stage.st-soon{border-left-color:var(--amber)}
.stage.st-todo{border-left-color:var(--blue)}
.stage-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:700 16px var(--display);margin-top:2px;flex:none}
.n-st-done{background:var(--green-soft);color:var(--green)}
.n-st-over{background:var(--red-soft);color:var(--red)}
.n-st-soon{background:var(--amber-soft);color:var(--amber)}
.n-st-todo{background:var(--blue-soft);color:var(--blue)}
.stage-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.stage-head h4{font:700 17.5px var(--display);display:flex;align-items:center;gap:6px}
.st-edit{opacity:0}
.stage-head h4:hover .st-edit{opacity:1}
.stage-title-input{font:700 17.5px var(--display);border:none;border-bottom:2px solid var(--accent);
  background:transparent;outline:none;width:100%;max-width:440px;padding:0 0 2px;color:var(--ink)}
.stage-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dl{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--mut)}
.dl.bad{color:var(--red);font-weight:700}
.tasks{list-style:none;margin:10px 0 4px;border-top:1px dashed var(--line);padding-top:8px}
.task{display:flex;align-items:flex-start;gap:6px;padding:5px 6px;border-radius:8px;transition:background .15s;flex-wrap:wrap}
.task:hover{background:var(--surface2)}
.task .t-edit,.task .iconbtn.t-del{opacity:0}
.task:hover .t-edit,.task:hover .t-del{opacity:1}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1;min-width:min(230px,100%)}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:19px;height:19px;margin-top:2px;border:2px solid var(--mut);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:all .18s}
.box svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:all .18s}
.chk input:checked + .box{background:var(--green);border-color:var(--green)}
.chk input:checked + .box svg{opacity:1;transform:scale(1)}
.chk input:checked ~ .txt{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(39,34,25,.3)}
.txt{color:var(--ink2);line-height:1.45}
.task-assign{font:600 12px var(--body);color:var(--ink2);border:1px dashed var(--line);border-radius:999px;
  padding:3px 9px;background:transparent;cursor:pointer;max-width:180px;transition:.15s;margin-top:1px}
select.task-assign{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.task-assign:hover{border-color:var(--blue);color:var(--blue)}
.task-assign.has{border-style:solid;border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
button.task-assign{display:inline-flex;align-items:center;gap:5px;color:var(--mut)}
button.task-assign:hover{color:var(--blue);border-color:var(--blue)}
.task-edit-input{flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--accent);border-radius:8px;
  font:500 13.5px var(--body);outline:none;background:var(--surface);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.stage-actions{display:flex;gap:18px;align-items:center;margin-top:6px;flex-wrap:wrap}
.task-add-row{display:flex;gap:8px;align-items:center;flex:1;min-width:220px}
.task-add-row input{flex:1;padding:7px 10px;border:1px solid var(--accent);border-radius:8px;
  font:500 13.5px var(--body);outline:none;background:var(--surface);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.divider-done{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:700;font-size:12.5px;
  letter-spacing:.1em;text-transform:uppercase;margin:20px 0 14px}
.divider-done::before,.divider-done::after{content:'';flex:1;height:1px;background:var(--line)}
.divider-done svg{flex:none}

/* ---------- timeline ---------- */
.tl-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tl-cards.one{grid-template-columns:1fr}
.kd{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 16px;box-shadow:var(--shadow)}
.kd span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kd b{display:block;font:700 20px var(--display);margin:4px 0 2px}
.kd small{color:var(--ink2);font-size:12.5px}
.kd-dv{border-top:3px solid var(--accent)}
.kd-open{border-top:3px solid var(--blue)}
.kd-ret{border-top:3px solid var(--green)}
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
.tl-scroll::-webkit-scrollbar{height:8px}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.tl-canvas{position:relative;height:244px;min-width:100%}
.tl-month{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.tl-month span{position:absolute;top:6px;left:5px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.tl-axis{position:absolute;top:118px;height:2px;background:var(--line);left:16px;right:16px;border-radius:2px}
.tl-today{position:absolute;top:0;height:100%;border-left:2px dashed var(--red);z-index:4}
.tl-today span{position:absolute;top:88px;left:0;transform:translateX(-50%);background:var(--red);color:#fff;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tl-key{position:absolute;left:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.tl-key .flag{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.tl-key .stem{width:2px}
.k-dv{top:12px}.k-dv .flag{background:var(--accent)}.k-dv .stem{height:80px;background:var(--accent)}
.k-open{top:46px}.k-open .flag{background:var(--blue)}.k-open .stem{height:46px;background:var(--blue)}
.k-ret{top:12px}.k-ret .flag{background:var(--green)}.k-ret .stem{height:80px;background:var(--green)}
.tl-dot{position:absolute;top:110px;width:17px;height:17px;border-radius:50%;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;color:#fff;z-index:3;border:2px solid var(--surface);
  box-shadow:0 1px 4px rgba(0,0,0,.22);cursor:default;transition:transform .15s}
.tl-dot:hover{transform:translateX(-50%) scale(1.35);z-index:6}
.tl-dot b{font-size:8.5px;font-weight:800;line-height:1}
.tl-dot.st-done{background:var(--green)}
.tl-dot.st-over{background:var(--red);animation:blink 1.6s infinite}
.tl-dot.st-soon{background:var(--amber)}
.tl-dot.st-todo{background:var(--blue)}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(179,57,47,.45)}50%{box-shadow:0 0 0 7px rgba(179,57,47,0)}}
.tl-lab{position:absolute;transform-origin:0 0;transform:rotate(38deg);font-size:10.5px;color:var(--ink2);white-space:nowrap}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink2)}
.tl-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg.st-done{background:var(--green)}.lg.st-over{background:var(--red)}.lg.st-soon{background:var(--amber)}.lg.st-todo{background:var(--blue)}
.lg-today{background:none!important;width:2px!important;height:12px!important;border-radius:0!important;border-left:2px dashed var(--red)}

/* ---------- contacts ---------- */
.contact-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.panel-head h3{font:700 18px var(--display)}
.panel-head .row-gap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.link-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--line);
  border-radius:10px;margin-bottom:8px;background:var(--surface2)}
.lr-main{min-width:0}
.lr-main b{font-size:14.5px}
.lr-main small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.lr-act{display:flex;gap:4px;align-items:center;flex:none}
.attach-panel{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px;display:flex;
  flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.attach-item{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer}
.attach-item:hover{background:var(--surface2)}
.attach-item b{font-size:13.5px;display:block}
.attach-item small{color:var(--mut);font-size:11.5px;display:block}
.attach-item input{accent-color:var(--accent);width:16px;height:16px;flex:none}

/* ---------- notes ---------- */
.composer{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);margin-bottom:18px}
.composer textarea{width:100%;border:none;background:transparent;resize:vertical;min-height:54px;
  font:400 15px/1.5 var(--body);outline:none;color:var(--ink)}
.composer-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.swatches{display:flex;gap:8px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--sw);cursor:pointer;transition:.15s}
.sw:hover{transform:scale(1.15)}
.sw.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.notes-grid{columns:3 230px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;background:var(--nc,#fffdf6);border:1px solid rgba(39,34,25,.09);
  border-radius:10px;padding:28px 14px 10px;position:relative;box-shadow:0 2px 6px rgba(39,34,25,.06);
  transition:transform .2s,box-shadow .2s}
.note:nth-child(odd){transform:rotate(-.5deg)}
.note:nth-child(even){transform:rotate(.45deg)}
.note:hover{transform:rotate(0) translateY(-2px);box-shadow:var(--shadow)}
.note.pinned{border-color:rgba(193,78,36,.5)}
.note.sun{--nc:#fbf0c4}.note.rose{--nc:#fadfdc}.note.sky{--nc:#dbe9f6}.note.mint{--nc:#dcefe1}.note.paper{--nc:#fffdf6}
[data-theme="dark"] .note{border-color:rgba(232,228,220,.14)}
[data-theme="dark"] .note.sun{--nc:rgba(251,240,196,.14)}
[data-theme="dark"] .note.rose{--nc:rgba(250,223,220,.14)}
[data-theme="dark"] .note.sky{--nc:rgba(219,233,246,.14)}
[data-theme="dark"] .note.mint{--nc:rgba(220,239,225,.14)}
[data-theme="dark"] .note.paper{--nc:rgba(255,253,246,.09)}
.note-text{white-space:pre-wrap;font-size:14px;line-height:1.5}
.note footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  color:var(--mut);font-size:11.5px;gap:6px;flex-wrap:wrap}
.note-btns button{background:none;border:none;cursor:pointer;color:inherit;opacity:.7;padding:2px;display:inline-flex}
.note-btns button:hover{opacity:1;color:var(--accent)}
.pinbtn{position:absolute;top:6px;right:6px;opacity:.45}
.pinbtn.on{opacity:1;color:var(--accent)}
.edit-ta{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:8px;
  font:400 14px/1.5 var(--body);background:var(--bg);color:var(--ink);outline:none;resize:vertical}

/* ---------- book ---------- */
.book-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:30px;flex-wrap:wrap}
.book-head h1{font:700 clamp(28px,4vw,42px) var(--display);margin:6px 0}
.row-gap{display:flex;gap:9px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;margin-top:6px;padding-bottom:20px}
.bcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:17px;
  box-shadow:var(--shadow);transition:transform .22s}
.bcard:hover{transform:translateY(-3px)}
.bcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.bcard h3{font:700 19px var(--display)}
.bline{font-size:13.5px;color:var(--ink2);margin:3px 0;word-break:break-word}
.bline .dim{color:var(--mut)}
.bnote{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:8px;padding:7px 10px;margin-top:8px}
.bmeta{font-size:12px;color:var(--mut);margin-top:10px}
.bcard-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  border-top:1px dashed var(--line);padding-top:11px}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(39,34,25,.42);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:20px;z-index:90;animation:fade .2s}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.55)}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:min(540px,100%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .24s cubic-bezier(.2,.9,.3,1.15);
  max-height:88vh;overflow:auto}
.modal-sm{width:min(420px,100%)}
.modal h3{font:700 24px var(--display);margin-bottom:16px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:12px}
.modal input,.modal select,.modal textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font:500 14px var(--body);background:var(--bg);color:var(--ink);outline:none;transition:.15s;width:100%}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modal textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal-hint{font-size:12.5px;color:var(--mut);background:var(--surface2);border:1px dashed var(--line);
  border-radius:8px;padding:9px 12px;margin:4px 0;line-height:1.5}
.dir-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.dir-opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;
  text-align:left;transition:.15s;display:flex;flex-direction:column;gap:3px}
.dir-opt b{font:700 15px var(--body);color:var(--ink)}
.dir-opt span{font-size:12px;color:var(--mut)}
.dir-opt:hover{border-color:var(--accent)}
.dir-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.dir-opt.on b{color:var(--accent)}
.org-picker{display:flex;gap:8px;margin-bottom:9px}
.org-picker select{flex:1}
.org-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:22px;align-items:center}
.org-sel-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.org-sel-chip svg{width:12px;height:12px}
.osc-x{background:none;border:none;cursor:pointer;color:var(--mut);display:inline-flex;padding:0;transition:color .15s}
.osc-x:hover{color:var(--red)}
.confirm-text{color:var(--ink2);line-height:1.55}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:8px;z-index:120;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  opacity:0;transform:translateY(12px);transition:.3s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--red);color:#fff}

.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:44px 20px 34px}

@media(max-width:860px){
  .contact-cols{grid-template-columns:1fr}
  .tl-cards{grid-template-columns:1fr}
  .dir-picker{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .hdr-in{gap:8px}
  .hdr-right{width:100%;justify-content:space-between;margin-left:0}
  .stats{flex-direction:column}
  .stat + .stat{border-left:none;border-top:1px solid var(--line-soft)}
  .dates-line{flex-direction:column;align-items:stretch}
  .cd-banner{margin-left:0;justify-content:center}
  .grid3{grid-template-columns:1fr}
  .dir-picker{grid-template-columns:1fr}
  .stage{grid-template-columns:38px 1fr;padding:14px}
}
</style>

<body>
<header id="hdr"></header>
<main id="app"></main>
<footer class="foot">«Такие дела» · персональный трекер выдач, договоров и музейных проектов · версия 3.4 · данные хранятся локально в вашем браузере</footer>
<div id="modalRoot"></div>
<div id="toasts"></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const todayISO=()=>toISO(new Date());
const addDaysISO=(iso,n)=>{const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);};
const daysBetween=(a,b)=>Math.round((fromISO(b)-fromISO(a))/86400000);
const daysUntil=iso=>daysBetween(todayISO(),iso);
const MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fmtShort=iso=>{if(!iso)return '—';const d=fromISO(iso);return d.getDate()+' '+MONTHS[d.getMonth()];};
const fmtLong=iso=>{if(!iso)return '—';const d=fromISO(iso);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};
const plural=(n,one,few,many)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return many;if(n1>1&&n1<5)return few;if(n1===1)return one;return many;};
const dWord=n=>plural(n,'день','дня','дней');

const svg=p=>'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const svg16=p=>'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const I={
  plus:svg16('<path d="M12 5v14M5 12h14"/>'),
  back:svg16('<path d="M15 18l-6-6 6-6"/>'),
  dl:svg16('<path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
  ul:svg16('<path d="M12 14V3m0 0L8 7m4-4l4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
  trash:svg16('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/>'),
  pen:svg16('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>'),
  x:svg16('<path d="M6 6l12 12M18 6L6 18"/>'),
  check:svg16('<path d="M4 12l5 5L20 7"/>'),
  cal:svg16('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>'),
  pin:svg16('<circle cx="12" cy="8" r="5"/><path d="M12 13v8"/>'),
  user:svg16('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>'),
  sort:svg('<path d="M7 4v16m0 0l-3-3m3 3l3-3M17 20V4m0 0l-3 3m3-3l3 3"/>')
};

/* ================= приоритеты ================= */
const PRIO_LEVELS=[
  {key:'fire',      label:'горит',   color:'#b3392f'},
  {key:'important', label:'важное',  color:'#a9761c'},
  {key:'normal',    label:'штатное', color:'#41628e'},
  {key:'background',label:'фоновое', color:'#95896f'},
  {key:'pause',     label:'пауза',   color:'#6b6355'}
];
const PRIO_ORDER={fire:0,important:1,normal:2,background:3,pause:4};
const prioOf=p=>PRIO_LEVELS.find(l=>l.key===(p.priority||'normal'))||PRIO_LEVELS[2];
function prioChipHtml(p){
  const lv=prioOf(p);
  return '<button class="prio p-'+lv.key+'" data-action="prio-edit" data-id="'+p.id+'" title="Важность: '+lv.label+' — нажмите, чтобы изменить">'
   +'<i style="--pc:'+lv.color+'"></i>'+lv.label+'</button>';
}
function sortByPrio(list){
  return list.slice().sort((a,b)=>{
    const d=(PRIO_ORDER[a.priority||'normal']??2)-(PRIO_ORDER[b.priority||'normal']??2);
    if(d!==0)return d;
    return (a.dv||'9999-12-31').localeCompare(b.dv||'9999-12-31');
  });
}
let prioMenu=null;
function closePrioMenu(){
  if(prioMenu){prioMenu.menu.remove();prioMenu.back.remove();prioMenu=null;}
}
function openPrioMenu(p,anchor){
  closePrioMenu();
  const curKey=p.priority||'normal';
  const menu=document.createElement('div');
  menu.className='prio-menu';
  menu.innerHTML='<p class="prio-menu-cap">Важность проекта</p>'
   +PRIO_LEVELS.map(lv=>'<button class="prio-item'+(curKey===lv.key?' active':'')+'" data-prio="'+lv.key+'">'
     +'<i style="--pc:'+lv.color+'"></i>'+lv.label+(curKey===lv.key?'<span class="pm-check">✓</span>':'')+'</button>').join('');
  const back=document.createElement('div');
  back.className='prio-backdrop';
  back.addEventListener('click',closePrioMenu);
  document.body.append(back,menu);
  const r=anchor.getBoundingClientRect();
  const mw=176,mh=menu.offsetHeight;
  let x=r.left,y=r.bottom+6;
  if(x+mw>window.innerWidth-8)x=Math.max(8,window.innerWidth-mw-8);
  if(y+mh>window.innerHeight-8)y=Math.max(8,r.top-mh-6);
  menu.style.left=x+'px';menu.style.top=y+'px';
  menu.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-prio]');if(!b)return;
    p.priority=b.dataset.prio;
    persist();closePrioMenu();renderApp();
    toast('Важность: '+prioOf(p).label);
  });
  prioMenu={menu,back};
}

/* ---- миграции старых данных ---- */
function migrateOldTwoStages(p){
  const i=p.stages.findIndex(s=>s.t==='Согласование списка предметов');
  if(i<0)return false;
  const B=p.stages[i+1];
  if(!B||B.t!=='Проверка сохранности')return false;
  const A=p.stages[i];
  const src=(st,k)=>st.tasks[k]||{done:false,assigneeId:''};
  const cond=src(B,0);
  const tasks=[
    {id:uid(),text:MERGED_STAGE.tasks[0],done:src(A,0).done,assigneeId:src(A,0).assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[1],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[2],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[3],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[4],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[5],done:src(A,2).done,assigneeId:src(A,2).assigneeId||''}
  ];
  A.tasks.concat(B.tasks).forEach(t=>{if(t.custom)tasks.push(t);});
  p.stages.splice(i,2,{t:MERGED_STAGE.t,a:'dv',off:MERGED_STAGE.off,tasks});
  return true;
}
function migrateExpandMerged(p){
  const s=p.stages.find(x=>x.t===MERGED_STAGE.t);
  if(!s)return false;
  const base=s.tasks.filter(t=>!t.custom);
  if(base.length!==3)return false;
  const cond=base[1];
  const tasks=[
    {id:uid(),text:MERGED_STAGE.tasks[0],done:base[0].done,assigneeId:base[0].assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[1],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[2],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[3],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[4],done:cond.done,assigneeId:cond.assigneeId||''},
    {id:uid(),text:MERGED_STAGE.tasks[5],done:base[2].done,assigneeId:base[2].assigneeId||''}
  ];
  s.tasks.filter(t=>t.custom).forEach(t=>tasks.push(t));
  s.tasks=tasks;
  return true;
}
function migrateToV2(p){
  const OLD_GONE=['Логистика и упаковка','Документы на выдачу','Демонтаж','Контроль на выставке','Доставка и монтаж'];
  if(!p.stages.some(s=>OLD_GONE.includes(s.t)))return false;
  const old={};
  p.stages.forEach(s=>{old[s.t]=s;});
  const src=(title,i)=>{const s=old[title];const t=s&&s.tasks[i];return t||{done:false,assigneeId:''};};
  const cust=titles=>titles.reduce((a,t)=>{const s=old[t];if(s)s.tasks.forEach(x=>{if(x.custom)a.push(x);});return a;},[]);
  const mk=(text,s)=>({id:uid(),text:text,done:!!s.done,assigneeId:s.assigneeId||''});
  const EMPTY={done:false,assigneeId:''};
  const CHANGED=['Договор и страхование','Выдача предметов','Возврат предметов'];

  const stages=[];
  STAGES_TEMPLATE.forEach(tpl=>{
    if(old[tpl.t]&&!CHANGED.includes(tpl.t)){stages.push(old[tpl.t]);return;}
    let tasks;
    if(tpl.t==='Договор и страхование'){
      tasks=[
        mk('Страховая оценка утверждена ЭФЗК',src('Договор и страхование',1)),
        mk('Согласован маршрут / адреса / сроки перевозки.',src('Логистика и упаковка',0)),
        mk('Проект договора о выдаче согласован сторонами.',src('Договор и страхование',0)),
        mk('Получена копия страхового полиса.',EMPTY),
        mk('Договор подписан сторонами.',src('Договор и страхование',2)),
        mk('Направлена заявка на сделку в Мин.Культ РФ.',EMPTY)
      ].concat(cust(['Договор и страхование']));
    }else if(tpl.t==='Выдача предметов'){
      tasks=[
        mk('Получено одобрение сделки от Мин.Культа РФ.',EMPTY),
        mk('Подготовлена доверенность на сопровождающего / хранителя.',src('Документы на выдачу',1)),
        mk('Подготовлены акты передачи.',src('Документы на выдачу',0)),
        mk('Определён срок / место упаковки и погрузки.',EMPTY),
        mk('Заказан пропуск на автотранспорт.',EMPTY),
        mk('Акты подписаны. Предметы упакованы и загружены.',src('Выдача предметов',1))
      ].concat(cust(['Логистика и упаковка','Документы на выдачу','Выдача предметов']));
    }else if(tpl.t==='Возврат предметов'){
      tasks=[
        mk('Дата возврата согласована.',src('Демонтаж',0)),
        mk('Пропуск на транспорт заказан.',EMPTY),
        mk('Доверенность сопровождающего запрошена.',EMPTY),
        mk('Предметы получены. Сохранность сверена. Акты подписаны.',src('Возврат предметов',2)),
        mk('Направлена заявка в Госкаталог на закрытие сделки.',EMPTY)
      ].concat(cust(['Демонтаж','Возврат предметов','Доставка и монтаж','Контроль на выставке','Экспонирование и возврат','Итоговая проверка и закрытие']));
    }else{
      tasks=tpl.tasks.map(x=>({id:uid(),text:x,done:false,assigneeId:''}));
    }
    stages.push({t:tpl.t,a:tpl.a,off:tpl.off,tasks});
  });
  p.stages=stages;
  return true;
}
function migrateToV21(p){
  const REMOVED=['Доставка и монтаж','Экспонирование и возврат','Итоговая проверка и закрытие'];
  if(!p.stages.some(s=>REMOVED.includes(s.t)))return false;
  const old={};
  p.stages.forEach(s=>{old[s.t]=s;});
  const customs=[];
  REMOVED.forEach(t=>{const s=old[t];if(s)s.tasks.forEach(x=>{if(x.custom)customs.push(x);});});
  const stages=[];
  STAGES_TEMPLATE.forEach(tpl=>{
    if(old[tpl.t]){stages.push(old[tpl.t]);}
    else{stages.push({t:tpl.t,a:tpl.a,off:tpl.off,tasks:tpl.tasks.map(x=>({id:uid(),text:x,done:false,assigneeId:''}))});}
  });
  if(customs.length){
    const ret=stages.find(s=>s.t==='Возврат предметов');
    if(ret)ret.tasks=ret.tasks.concat(customs);
  }
  p.stages=stages;
  return true;
}
function migrateAll(){
  let changed=false;
  state.projects.forEach(p=>{
    if(!p.direction){p.direction='vydacha';changed=true;}
    if(migrateOldTwoStages(p))changed=true;
    if(migrateExpandMerged(p))changed=true;
    if(migrateToV2(p))changed=true;
    if(migrateToV21(p))changed=true;
  });
  if(changed)persist(false);
}
function persist(flash){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  if(flash!==false)flashSave();
}

/* ================= вычисления ================= */
function projStats(p){let done=0,total=0;p.stages.forEach(s=>s.tasks.forEach(t=>{total++;if(t.done)done++;}));return{done,total,pct:total?Math.round(done/total*100):0};}
function projPhase(p){
  const st=projStats(p),T=todayISO(),single=isDog(p)||isMuseum(p);
  if(st.total&&st.done===st.total)return{key:'done',cls:'c-muted',label:'Завершён'};
  if(p.dv&&T>p.dv){
    if(single)return{key:'late',cls:'c-red',label:'Просрочен'};
    if(p.ret&&T>p.ret)return{key:'late',cls:'c-amber',label:'Возврат · проверка'};
    return{key:'out',cls:'c-green',label:'На выставке'};
  }
  return{key:'prep',cls:'c-blue',label:(isDog(p)||isMuseum(p))?'В работе':'Подготовка'};
}
function countdownText(p){
  if(!p.dv)return 'дата не задана';
  const n=daysUntil(p.dv);
  if(n>1)return 'через '+n+' '+dWord(n);
  if(n===1)return 'завтра';
  if(n===0)return 'сегодня';
  return (-n)+' '+dWord(-n)+' назад';
}
function cdInfo(p){
  const single=isDog(p)||isMuseum(p);
  const word=single?'срока':'выдачи';
  const n=daysUntil(p.dv);
  if(n>1)return{cls:'prep',big:String(n),lab:plural(n,'день','дня','дней')+' до '+word};
  if(n===1)return{cls:'prep',big:'1',lab:'день до '+word};
  if(n===0)return{cls:'today',big:'✳',lab:isMuseum(p)?'дата проекта сегодня':(isDog(p)?'срок сегодня':'выдача сегодня')};
  if(single)return{cls:'over',big:String(-n),lab:plural(-n,'день','дня','дней')+' просрочка'};
  if(p.ret){const r=daysUntil(p.ret);
    if(r>1)return{cls:'out',big:String(r),lab:plural(r,'день','дня','дней')+' до возврата'};
    if(r===1)return{cls:'out',big:'1',lab:'день до возврата'};
    if(r===0)return{cls:'today',big:'✳',lab:'возврат сегодня'};
    return{cls:'ret',big:'✓',lab:'возврат завершён'};}
  return{cls:'out',big:String(-n),lab:plural(-n,'день','дня','дней')+' на выставке'};
}
function stageDeadline(p,s){
  const base=s.a==='ret'?p.ret:(s.a==='open'?(p.open||p.dv):p.dv);
  return base?addDaysISO(base,s.off):null;
}
function stageInfo(p,s){
  const allDone=s.tasks.length&&s.tasks.every(t=>t.done);
  const dl=stageDeadline(p,s);
  if(allDone)return{status:'done',cls:'st-done',chipCls:'c-green',label:'Готово'};
  if(dl&&daysUntil(dl)<0)return{status:'overdue',cls:'st-over',chipCls:'c-red',label:'Просрочено'};
  const started=s.tasks.some(t=>t.done);
  if(dl&&daysUntil(dl)<=7)return{status:'soon',cls:'st-soon',chipCls:'c-amber',label:started?'В работе':'Скоро'};
  return{status:'todo',cls:'st-todo',chipCls:'c-blue',label:started?'В работе':'Ожидает'};
}
const stageComplete=s=>s.tasks.length&&s.tasks.every(t=>t.done);
const execById=id=>state.executors.find(x=>x.id===id)||null;
const execTasksCount=id=>state.projects.reduce((a,p)=>a+p.stages.reduce((b,s)=>b+s.tasks.filter(t=>(t.assigneeId||'')===id).length,0),0);

function dashStats(pool){
  const T=todayISO();
  const inWork=pool.filter(p=>{const s=projStats(p);return !(s.total&&s.done===s.total);}).length;
  const upcoming=pool.filter(p=>p.dv&&p.dv>=T).sort((a,b)=>a.dv.localeCompare(b.dv))[0];
  return{total:pool.length,inWork,upcoming};
}

/* -------- таймлайн -------- */
function timelineTab(p){
  const single=isDog(p)||isMuseum(p),museum=isMuseum(p);
  const T=todayISO(),items=[],keys=[];
  p.stages.forEach((s,i)=>{const dl=stageDeadline(p,s);if(dl)items.push({date:dl,i,s});});
  if(p.dv)keys.push({date:p.dv,label:single?'Срок':'Выдача',cls:'k-dv'});
  if(!single&&p.open)keys.push({date:p.open,label:'Открытие',cls:'k-open'});
  if(!single&&p.ret)keys.push({date:p.ret,label:'Возврат',cls:'k-ret'});
  const all=items.map(x=>x.date).concat(keys.map(k=>k.date)).sort();
  if(!all.length)return '<p class="empty">Укажите ключевую дату, чтобы построить таймлайн.</p>';
  const start=addDaysISO(all[0],-7),end=addDaysISO(all[all.length-1],9);
  const totalDays=Math.max(daysBetween(start,end),1);
  const px=Math.max(13,Math.min(30,Math.round(1500/totalDays)));
  const PAD=26,width=totalDays*px+PAD*2;
  const X=iso=>PAD+daysBetween(start,iso)*px;
  let monthsHtml='';
  {let d=fromISO(start);d.setDate(1);if(toISO(d)<start)d.setMonth(d.getMonth()+1);
   while(toISO(d)<=end){monthsHtml+='<div class="tl-month" style="left:'+X(toISO(d))+'px"><span>'+MONTHS[d.getMonth()]+(d.getMonth()===0?' '+d.getFullYear():'')+'</span></div>';d.setMonth(d.getMonth()+1);}}
  const todayHtml=(T>=start&&T<=end)?'<div class="tl-today" style="left:'+X(T)+'px"><span>сегодня</span></div>':'';
  const keysHtml=keys.map(k=>'<div class="tl-key '+k.cls+'" style="left:'+X(k.date)+'px"><span class="flag">'+k.label+'</span><i class="stem"></i></div>').join('');
  const words={done:'готово',overdue:'просрочено',soon:'скоро — осталось меньше недели',todo:'впереди'};
  const dotsHtml=items.map(it=>{
    const inf=stageInfo(p,it.s);
    const lab=(it.i+1)+'. '+(it.s.t.length>26?it.s.t.slice(0,26)+'…':it.s.t);
    const tip=esc((it.i+1)+'. '+it.s.t+' — до '+fmtLong(it.date)+' · '+words[inf.status]);
    return '<div class="tl-dot '+inf.cls+'" style="left:'+X(it.date)+'px" title="'+tip+'"><b>'+(it.i+1)+'</b></div>'
      +'<span class="tl-lab" style="left:'+(X(it.date)+2)+'px;top:'+(it.i%2?152:128)+'px">'+esc(lab)+'</span>';
  }).join('');
  const cdFor=iso=>{const n=daysUntil(iso);if(n===0)return 'сегодня';if(n>0)return 'через '+n+' '+dWord(n);return (-n)+' '+dWord(-n)+' назад';};
  const cdLabel=museum?'Дата проекта':(isDog(p)?'Срок предоставления':'Дата выдачи');
  const cards=single
    ? '<div class="kd kd-dv"><span>'+cdLabel+'</span><b>'+(p.dv?fmtLong(p.dv):'—')+'</b><small>'+(p.dv?cdFor(p.dv):'не указан')+'</small></div>'
    : [['Дата выдачи',p.dv,'kd-dv'],['Открытие',p.open,'kd-open'],['Возврат',p.ret,'kd-ret']].map(c=>
        '<div class="kd '+c[2]+'"><span>'+c[0]+'</span><b>'+(c[1]?fmtLong(c[1]):'—')+'</b><small>'+(c[1]?cdFor(c[1]):'не указана')+'</small></div>').join('');
  return '<div class="tl-cards rise'+(single?' one':'')+'">'+cards+'</div>'
   +'<div class="tl-scroll rise" style="animation-delay:70ms"><div class="tl-canvas" style="width:'+width+'px">'
   +monthsHtml+'<div class="tl-axis"></div>'+todayHtml+keysHtml+dotsHtml+'</div></div>'
   +'<div class="tl-legend"><span><i class="lg st-done"></i>готово</span><span><i class="lg st-over"></i>просрочено</span>'
   +'<span><i class="lg st-soon"></i>скоро</span><span><i class="lg st-todo"></i>впереди</span><span><i class="lg lg-today"></i>сегодня</span></div>'
   +'<p class="hint">Наведите курсор на точку этапа, чтобы увидеть детали. Дедлайны пересчитываются автоматически при смене дат в шапке проекта.</p>';
}

function attachPanel(kind,p){
  const list=kind==='org'?state.orgs:state.contacts;

  return '<div class="attach-panel">'+list.map(item=>{
    const sub=kind==='org'?(item.city||item.type||''):(item.position||'');

     +'<span><b>'+esc(item.name)+'</b><small>'+esc(sub)+'</small></span></label>';
  }).join('')+'</div>';

   +'<button class="btn ghost sm" data-action="attach-open" data-kind="contact">'+(ui.openAttach==='contact'?'Скрыть список':I.plus+' Привязать')+'</button>'

function syncNav(){
  const d=$('#navDash'),b=$('#navBook');
  if(d){d.classList.toggle('active',ui.view!=='book');d.setAttribute('aria-current',ui.view!=='book'?'page':'false');}
  if(b){b.classList.toggle('active',ui.view==='book');b.setAttribute('aria-current',ui.view==='book'?'page':'false');}

function refreshTab(saveDraft){
  if(saveDraft!==false){
    const nt=$('#noteText');
    if(nt)ui.noteDraft=nt.value;
  }
  const p=cur(),body=$('#tabBody');
  if(p&&body)body.innerHTML=renderTab(p);
  updateTabButtons();

function updateTabButtons(){
  if(ui.view!=='project')return;
  $$('.ptabs .ptab').forEach(b=>b.classList.toggle('active',b.dataset.tab===ui.tab));
}

/* ================= тема ================= */
function isDark(){return document.documentElement.getAttribute('data-theme')==='dark';}
function toggleTheme(){
  const html=document.documentElement;
  if(isDark()){html.removeAttribute('data-theme');try{localStorage.setItem(LS_THEME,'light');}catch(e){}}
  else{html.setAttribute('data-theme','dark');try{localStorage.setItem(LS_THEME,'dark');}catch(e){}}
  $('#hdr').innerHTML=headerHTML();
  syncNav();
}

function createProject(){
  let dv;
  if(npDir==='dogovory')dv=$('#np-dv-dog').value;
  else if(npDir==='museum')dv=$('#np-dv-museum').value;
  else dv=$('#np-dv').value;
  const name=$('#np-name').value.trim();
  if(!name){toast('Укажите название проекта','err');return;}
  if(!dv){toast(npDir==='dogovory'?'Укажите срок предоставления':(npDir==='museum'?'Укажите дату проекта':'Укажите дату выдачи'),'err');return;}
  const orgName=$('#np-org').value.trim();
  let orgId=null;

  const open=npDir==='vydacha'?($('#np-open').value||''):'';

  ui.view='project';ui.projectId=p.id;ui.tab='stages';ui.openAttach=null;

/* ================= экспорт / импорт / тосты ================= */
function exportData(){
  const blob=new Blob([JSON.stringify({app:'Такие дела',version:'3.4',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='takie-dela-'+todayISO()+'.json';a.click();
  URL.revokeObjectURL(a.href);toast('Резервная копия скачана');
}
function exportCSV(){
  const rows=[['Название','Направление','Партнёр','Приоритет','Статус','Ключевая дата','Прогресс, %']];
  state.projects.forEach(p=>{
    const st=projStats(p);
    const org=state.orgs.find(o=>o.id===p.orgId);
    const ph=projPhase(p);
    const dirLabel={vydacha:'Выдача',dogovory:'Договоры',museum:'Музейное'}[p.direction||'vydacha']||'Выдача';
    rows.push([p.name,dirLabel,org?org.name:'',prioOf(p).label,ph.label,p.dv||'',st.pct]);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='takie-dela-'+todayISO()+'.csv';a.click();
  URL.revokeObjectURL(a.href);toast('CSV выгружен');
}
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),d=j.data||j;
      if(!Array.isArray(d.projects))throw new Error('bad');
      state=normalize(d);
      migrateAll();
      persist();ui.view='dash';ui.projectId=null;renderApp();toast('Данные импортированы');
    }catch(e){toast('Не удалось прочитать файл','err');}
  };
  r.readAsText(file);
}
function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast'+(type==='err'?' err':'');el.textContent=msg;
  $('#toasts').append(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),320);},2600);
}

/* ================= события ================= */
function onClick(e){
  if(e.target.classList&&e.target.classList.contains('overlay')){closeModal();return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id,p=cur();
  switch(a){
    case 'nav-dash':ui.view='dash';renderApp();window.scrollTo(0,0);break;
    case 'nav-book':ui.view='book';renderApp();window.scrollTo(0,0);break;
    case 'theme-toggle':toggleTheme();break;
    case 'new-project':openNewProject();break;
    case 'open-project':ui.view='project';ui.projectId=id;ui.tab='stages';ui.openAttach=null;ui.addingStage=null;ui.editStage=null;ui.editTask=null;renderApp();window.scrollTo(0,0);break;
    case 'back':ui.view='dash';renderApp();window.scrollTo(0,0);break;
    case 'rename-start':startRename();break;
    case 'delete-project':deleteProject();break;
    case 'prio-edit':{const pr=state.projects.find(x=>x.id===id);if(pr)openPrioMenu(pr,el);break;}
    case 'sort-prio':{
      ui.sortByPrio=!ui.sortByPrio;
      try{localStorage.setItem(LS_SORT,ui.sortByPrio?'1':'0');}catch(err){}
      renderApp();
      toast(ui.sortByPrio?'Проекты отсортированы: горит → пауза':'Сортировка по приоритету выключена');
      break;
    }
    case 'dir-filter':{
      const idx=(DIR_CYCLE.indexOf(ui.dirFilter)+1)%DIR_CYCLE.length;
      ui.dirFilter=DIR_CYCLE[idx];
      try{localStorage.setItem(LS_DIRFILTER,ui.dirFilter);}catch(err){}
      renderApp();
      toast('Показаны: '+DIR_FILTER_LABEL[ui.dirFilter]);
      break;
    }
    case 'partner-edit':openPartnerModal();break;
    case 'pt-save':savePartner();break;
    case 'tab':ui.tab=el.dataset.tab;ui.openAttach=null;ui.addingStage=null;ui.editStage=null;ui.editTask=null;refreshTab();break;
    case 'task-add':ui.addingStage=+el.dataset.stage;ui.editTask=null;replaceStages();focusTaskAdd();break;
    case 'task-add-cancel':ui.addingStage=null;replaceStages();break;
    case 'task-edit':ui.editTask={stage:+el.dataset.stage,id:el.dataset.id};ui.editStage=null;ui.addingStage=null;replaceStages();focusTaskEdit();break;
    case 'stage-title-edit':ui.editStage=+el.dataset.stage;ui.editTask=null;replaceStages();focusStageTitle();break;
    case 'task-del':{
      const s=p.stages[+el.dataset.stage];
      s.tasks=s.tasks.filter(t=>t.id!==id);
      persist();replaceStages();toast('Задача удалена');break;
    }
    case 'stage-toggle-all':{
      const s=p.stages[+el.dataset.stage];
      const all=s.tasks.every(t=>t.done);
      s.tasks.forEach(t=>t.done=!all);
      persist();replaceStages();break;
    }
    case 'attach-open':{
      const k=el.dataset.kind;
      ui.openAttach=ui.openAttach===k?null:k;refreshTab();break;
    }
    case 'attach-remove':{
      const arr=el.dataset.kind==='org'?p.orgIds:p.contactIds;
      const idx=arr.indexOf(id);if(idx>-1)arr.splice(idx,1);
      persist();refreshTab();break;
    }
    case 'contact-quick-new':ui.quickContact=true;openContactModal();break;
    case 'goto-book':ui.view='book';ui.bookTab='orgs';renderApp();window.scrollTo(0,0);break;
    case 'goto-executors':ui.view='book';ui.bookTab='execs';renderApp();window.scrollTo(0,0);break;
    case 'org-edit':{const o=state.orgs.find(x=>x.id===id);if(o)openOrgModal(o);break;}
    case 'contact-edit':{ui.quickContact=false;const c=state.contacts.find(x=>x.id===id);if(c)openContactModal(c);break;}
    case 'exec-edit':{const x=state.executors.find(e=>e.id===id);if(x)openExecModal(x);break;}
    case 'org-del':delOrg(id);break;
    case 'contact-del':delContact(id);break;
    case 'exec-del':delExec(id);break;
    case 'org-new':openOrgModal();break;
    case 'contact-new':ui.quickContact=false;openContactModal();break;
    case 'exec-new':openExecModal();break;
    case 'book-tab':ui.bookTab=el.dataset.tab;renderApp();break;
    case 'modal-close':closeModal();break;
    case 'm-org-remove':{const idx=contactModalOrgs.indexOf(id);if(idx>-1)contactModalOrgs.splice(idx,1);renderModalOrgChips();break;}
    case 'np-create':createProject();break;
    case 'org-save':saveOrg(el.dataset.id);break;
    case 'contact-save':saveContact(el.dataset.id);break;
    case 'exec-save':saveExec(el.dataset.id);break;
    case 'export':exportData();break;
    case 'export-csv':exportCSV();break;
    case 'import':$('#fileInput').click();break;
    case 'note-color':ui.noteColor=el.dataset.c;$$('.sw').forEach(s=>s.classList.toggle('active',s.dataset.c===ui.noteColor));break;
    case 'note-add':addNote();break;
    case 'note-pin':{const n=state.notes.find(x=>x.id===id);if(n){n.pinned=!n.pinned;persist();refreshTab();}break;}
    case 'note-edit':ui.editNote=id;refreshTab();{const ta=$('#editNoteText');if(ta){ta.focus();ta.selectionStart=ta.value.length;}}break;
    case 'note-save':{
      const n=state.notes.find(x=>x.id===id),ta=$('#editNoteText');
      if(n&&ta){const v=ta.value.trim();if(v)n.text=v;}
      ui.editNote=null;persist();refreshTab();break;
    }
    case 'note-cancel':ui.editNote=null;refreshTab();break;
    case 'note-del':askConfirm('Удалить заметку?',()=>{state.notes=state.notes.filter(x=>x.id!==id);persist();refreshTab();toast('Заметка удалена');});break;
  }
}
function onChange(e){
  const el=e.target,a=el.dataset.action;
  if(a==='task-toggle'){
    const p=cur();if(!p)return;
    const s=p.stages[+el.dataset.stage],t=s.tasks.find(x=>x.id===el.dataset.id);
    if(!t)return;
    const wasAll=s.tasks.every(x=>x.done);
    t.done=el.checked;
    const nowAll=s.tasks.every(x=>x.done);
    persist();
    const li=el.closest('.task');if(li)li.classList.toggle('done',t.done);
    updateStageChip(+el.dataset.stage);updateProjectProgress();
    if(wasAll!==nowAll)setTimeout(replaceStages,450);
  }else if(a==='task-assign'){
    const p=cur();if(!p)return;
    const s=p.stages[+el.dataset.stage],t=s.tasks.find(x=>x.id===el.dataset.id);
    if(!t)return;
    t.assigneeId=el.value||'';
    persist();
    el.classList.toggle('has',!!t.assigneeId);
    if(t.assigneeId){const x=execById(t.assigneeId);if(x)toast('Исполнитель: '+x.name);}
  }else if(a==='set-date'){
    const p=cur();if(!p)return;
    p[el.dataset.field]=el.value||'';
    persist();renderApp();toast('Даты обновлены — дедлайны пересчитаны');
  }else if(a==='attach-toggle'){
    const p=cur();if(!p)return;
    const arr=el.dataset.kind==='org'?p.orgIds:p.contactIds;
    const i=arr.indexOf(el.dataset.id);
    if(el.checked&&i===-1)arr.push(el.dataset.id);
    if(!el.checked&&i>-1)arr.splice(i,1);
    persist();refreshTab();
  }
}
function onKey(e){
  if(e.target&&e.target.id==='noteText'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();addNote();}
  if(e.key==='Escape'){
    if(prioMenu){closePrioMenu();return;}
    if($('#modalRoot').firstChild)closeModal();
  }
}

   +'<button class="btn ghost sm" data-action="import" title="Загрузить резервную копию JSON" aria-label="Импорт данных">'+I.ul+'<span>Импорт</span></button>'
   +'<button class="btn ghost sm" data-action="export" title="Скачать резервную копию JSON" aria-label="Экспорт JSON">'+I.dl+'<span>JSON</span></button>'
   +'<button class="btn ghost sm" data-action="export-csv" title="Скачать список проектов в CSV" aria-label="Экспорт CSV">'+I.dl+'<span>CSV</span></button></div></div>';
}
function init(){
  try{
    if(localStorage.getItem(LS_THEME)==='dark')document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
  $('#hdr').innerHTML=headerHTML();
  try{
    ui.sortByPrio=localStorage.getItem(LS_SORT)==='1';
    const df=localStorage.getItem(LS_DIRFILTER);
    if(df&&DIR_CYCLE.includes(df))ui.dirFilter=df;
  }catch(e){}
  load();
  migrateAll();
  renderApp();
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('keydown',onKey);
  document.addEventListener('focusin',onDateFocusIn);
  $('#fileInput').addEventListener('change',e=>{
    if(e.target.files&&e.target.files[0])importFile(e.target.files[0]);
    e.target.value='';
  });
}
init();
</script>
</body>
</html>
